[package]
name = "signalbench-app"
version = "0.1.0"
edition = "2021"
description = "SignalBench: 3D virtual bench for embedded firmware"

[lib]
name = "signalbench_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signalbench-core = { path = "../../sim/core" }

[profile.release]
opt-level = 3
lto = "thin"
