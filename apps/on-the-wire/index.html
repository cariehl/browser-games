<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>On the Wire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed course-map rail on the left, a single reading column on the right; collapses to a top bar on phones. */
:root {
  --paper: #f6f7f4;      /* datasheet paper */
  --panel: #ffffff;
  --ink: #1d2523;
  --ink-2: #4b5754;
  --rule: #d9ddd6;
  --mask: #0f5c55;       /* solder-mask green-teal, primary accent */
  --mask-soft: #e3efec;
  --copper: #b0612a;     /* copper trace, secondary accent */
  --copper-soft: #f6e9df;
  --ok: #1f7a3d; --ok-soft: #e4f3e8;
  --bad: #b3261e; --bad-soft: #fbe9e7;
  --warn: #8a5a00; --warn-soft: #fbf1dc;
  --code-bg: #f0f2ee;
  --code-ink: #1d2523;
  --kw: #0f5c55; --num: #b0612a; --com: #7b8682; --str: #6a4c93;
  --sig-hi: #0f5c55; --sig-ctrl: #0f5c55; --sig-tgt: #b0612a;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --rail: 288px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121816; --panel: #19211f; --ink: #e4ebe8; --ink-2: #a3b1ac; --rule: #2c3734;
    --mask: #4fbfae; --mask-soft: #1d3330; --copper: #e09a62; --copper-soft: #33261c;
    --ok: #63c784; --ok-soft: #173023; --bad: #f08a80; --bad-soft: #3a1d1a; --warn: #e5b85c; --warn-soft: #33290f;
    --code-bg: #0e1312; --code-ink: #dfe7e4; --kw: #5fd0bf; --num: #f0a96f; --com: #75837f; --str: #c3a6f0;
    --sig-hi: #4fbfae; --sig-ctrl: #4fbfae; --sig-tgt: #e09a62;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121816; --panel: #19211f; --ink: #e4ebe8; --ink-2: #a3b1ac; --rule: #2c3734;
  --mask: #4fbfae; --mask-soft: #1d3330; --copper: #e09a62; --copper-soft: #33261c;
  --ok: #63c784; --ok-soft: #173023; --bad: #f08a80; --bad-soft: #3a1d1a; --warn: #e5b85c; --warn-soft: #33290f;
  --code-bg: #0e1312; --code-ink: #dfe7e4; --kw: #5fd0bf; --num: #f0a96f; --com: #75837f; --str: #c3a6f0;
  --sig-hi: #4fbfae; --sig-ctrl: #4fbfae; --sig-tgt: #e09a62;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--font-body); margin: 0; }
a { color: var(--mask); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
code, pre, kbd { font-family: var(--font-mono); font-size: 0.88em; }
code { background: var(--code-bg); padding: 0.08em 0.35em; border-radius: 3px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; }

/* ---------- app shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--rule); background: var(--panel);
  padding-block: 20px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; font-stretch: 112%; }
.brand small { display: block; font-size: 0.72rem; color: var(--ink-2); letter-spacing: 0.06em; text-transform: uppercase; }
.overall { font-size: 0.8rem; color: var(--ink-2); display: grid; gap: 6px; }
.bar { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--mask); width: 0; transition: width .3s; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; padding: 8px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 0.92rem; line-height: 1.3; }
.toc a:hover { background: var(--mask-soft); }
.toc a[aria-current="page"] { background: var(--mask-soft); box-shadow: inset 3px 0 0 var(--mask); }
.toc .n { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2); padding-top: 2px; }
.toc .meta { display: block; font-size: 0.74rem; color: var(--ink-2); margin-top: 2px; }
.toc .done .n { color: var(--ok); }
.subtoc { list-style: none; margin: 2px 0 6px 36px; padding: 0; display: grid; gap: 0; border-left: 1px solid var(--rule); }
.subtoc button { all: unset; cursor: pointer; display: block; font-size: 0.8rem; color: var(--ink-2); padding: 3px 10px; }
.subtoc button:hover { color: var(--ink); }
.rail-foot { margin-top: auto; display: grid; gap: 8px; font-size: 0.78rem; color: var(--ink-2); }
.rail-foot button { justify-self: start; }

.main { min-width: 0; padding-block: 32px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
.col > * { min-width: 0; }

.topbar { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 auto 0 0; width: min(320px, 88vw); z-index: 30; transform: translateX(-102%); transition: transform .2s; height: 100%;
    padding-top: max(20px, env(safe-area-inset-top, 0px)); box-shadow: 0 0 40px rgba(0,0,0,.25); }
  .rail.open { transform: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; align-items: center; gap: 12px; background: var(--panel); border-bottom: 1px solid var(--rule);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--panel); }
  .topbar b { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; }
  .main { padding-top: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- buttons & inputs ---------- */
.btn { font: 600 0.88rem/1 var(--font-body); padding: 9px 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--mask); border-color: var(--mask); color: var(--panel); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 0.8rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=number], select { font: 0.95rem var(--font-mono); padding: 7px 9px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
label.inl { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--ink-2); }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; padding-block: 8px 4px; }
.eyebrow { font: 600 0.74rem var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--copper); }
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 800; font-stretch: 115%; letter-spacing: -0.02em; }
.hero p { margin: 0; max-width: 62ch; color: var(--ink-2); font-size: 1.05rem; }
.trace { width: 100%; height: 64px; display: block; }
.lessons-list { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.lesson-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 4px; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.lesson-row:hover { background: var(--mask-soft); }
.lesson-row .num { font: 700 1.6rem var(--font-display); color: var(--mask); font-stretch: 112%; }
.lesson-row h3 { font-size: 1.12rem; }
.lesson-row p { margin: 2px 0 0; font-size: 0.9rem; color: var(--ink-2); }
.lesson-row .stat { font-size: 0.78rem; color: var(--ink-2); text-align: right; min-width: 92px; display: grid; gap: 4px; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.how div { border-top: 2px solid var(--copper); padding-top: 10px; }
.how b { display: block; font-family: var(--font-display); }
.how p { margin: 4px 0 0; font-size: 0.9rem; color: var(--ink-2); }
@media (max-width: 640px) { .how { grid-template-columns: minmax(0, 1fr); } .lesson-row { grid-template-columns: 40px minmax(0,1fr); } .lesson-row .stat { grid-column: 2; text-align: left; } }

/* ---------- lesson ---------- */
.lesson-head { display: grid; gap: 10px; }
.lesson-head h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 800; font-stretch: 110%; letter-spacing: -0.015em; }
.lesson-head .tag { color: var(--ink-2); margin: 0; }
.scenario { background: var(--copper-soft); border-left: 3px solid var(--copper); padding: 14px 16px; border-radius: 0 6px 6px 0; }
.scenario b { font: 600 0.72rem var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--copper); display: block; margin-bottom: 4px; }
.section { display: grid; gap: 18px; scroll-margin-top: 70px; }
.section > h2 { font-size: 1.45rem; font-weight: 700; display: flex; gap: 12px; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--rule); }
.section > h2 .sn { font: 500 0.85rem var(--font-mono); color: var(--copper); }
.prose { max-width: 68ch; }
.prose p, .prose ul, .prose ol { margin: 0 0 0.9em; }
.prose li { margin-bottom: 0.3em; }
.prose > :last-child { margin-bottom: 0; }
sup.cite a { font: 600 0.68rem var(--font-mono); text-decoration: none; color: var(--copper); padding: 0 1px; }
sup.cite a:hover { text-decoration: underline; }
pre.code, pre.frame { background: var(--code-bg); color: var(--code-ink); padding: 12px 14px; border-radius: 6px; overflow-x: auto; line-height: 1.5; margin: 0 0 0.9em; }
pre.frame { border-left: 3px solid var(--mask); }
.tok-k { color: var(--kw); font-weight: 600; } .tok-n { color: var(--num); } .tok-c { color: var(--com); font-style: italic; } .tok-s { color: var(--str); } .tok-p { color: var(--copper); }
.tbl { border-collapse: collapse; font-size: 0.9rem; margin: 0 0 0.9em; width: 100%; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top; }
.tbl th { font: 600 0.78rem var(--font-body); letter-spacing: 0.04em; color: var(--ink-2); text-transform: uppercase; }
.tblwrap { overflow-x: auto; margin: 0 0 0.9em; }
.tblwrap .tbl { margin: 0; min-width: 560px; }
.canframe td, .canframe th { text-align: center; font-family: var(--font-mono); }
.callout { background: var(--mask-soft); padding: 12px 14px; border-radius: 6px; font-size: 0.95rem; }
.muted { color: var(--ink-2); font-size: 0.85rem; }

/* ---------- inline checks & quiz ---------- */
.q { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); padding: 14px 16px; display: grid; gap: 10px; }
.q .qh { font: 600 0.72rem var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mask); display: flex; justify-content: space-between; gap: 8px; }
.q .prompt { margin: 0; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; background: var(--paper); }
.opt:hover { border-color: var(--ink-2); }
.opt input { margin: 4px 0 0; accent-color: var(--mask); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fb { padding: 10px 12px; border-radius: 6px; font-size: 0.92rem; }
.fb.ok { background: var(--ok-soft); color: var(--ink); border-left: 3px solid var(--ok); }
.fb.no { background: var(--bad-soft); color: var(--ink); border-left: 3px solid var(--bad); }
.fb b { display: block; }
.checkpoint { display: grid; gap: 16px; }
.checkpoint > h2 { font-size: 1.45rem; padding-top: 10px; border-top: 2px solid var(--mask); }
.score { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 8px; background: var(--panel); border: 1px solid var(--rule); }
.score .big { font: 800 2rem var(--font-display); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font: 600 0.72rem var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.no { background: var(--bad-soft); color: var(--bad); } .pill.todo { background: var(--rule); color: var(--ink-2); } .pill.ch { background: var(--copper-soft); color: var(--copper); }

/* ---------- exercises ---------- */
.ex { border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); display: grid; overflow: hidden; }
.ex.challenge { border-color: var(--copper); }
.ex-head { padding: 14px 16px 0; display: grid; gap: 6px; }
.ex-head .kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: 600 0.72rem var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mask); }
.ex.challenge .ex-head .kicker { color: var(--copper); }
.ex-head h3 { font-size: 1.2rem; }
.ex-body { padding: 10px 16px 14px; font-size: 0.95rem; }
.ex-body p, .ex-body ul, .ex-body ol { margin: 0 0 0.7em; }
.editor { display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--code-bg); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); max-height: 560px; overflow: auto; }
.gutter { font: 13px/1.55 var(--font-mono); color: var(--com); text-align: right; padding: 12px 8px 12px 12px; user-select: none; white-space: pre; }
.gutter .errl { color: var(--bad); font-weight: 700; }
.editor textarea { font: 13px/1.55 var(--font-mono); color: var(--code-ink); background: transparent; border: 0; resize: none; padding: 12px 12px 12px 6px; outline: none; white-space: pre; overflow: hidden; tab-size: 4; min-height: 200px; width: 100%; }
.ex-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; align-items: center; }
.ex-actions .spacer { flex: 1; }
.results { padding: 0 16px 16px; display: grid; gap: 8px; }
.results:empty { display: none; }
.res-sum { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.test { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; font-size: 0.88rem; }
.test.pass { border-color: color-mix(in srgb, var(--ok) 40%, var(--rule)); }
.test.fail { border-color: var(--bad); background: var(--bad-soft); }
.test .tt { font-weight: 600; display: flex; gap: 8px; }
.test ul { margin: 6px 0 0; padding-left: 0; list-style: none; font-family: var(--font-mono); font-size: 0.8rem; display: grid; gap: 2px; }
.test li { overflow-wrap: anywhere; }
.test li.ok::before { content: "✓ "; color: var(--ok); }
.test li.no::before { content: "✗ "; color: var(--bad); }
.test pre { margin: 6px 0 0; background: var(--code-bg); padding: 6px 8px; border-radius: 4px; font-size: 0.78rem; overflow-x: auto; }
.err { border-left: 3px solid var(--bad); background: var(--bad-soft); padding: 10px 12px; border-radius: 0 6px 6px 0; font-size: 0.9rem; }
.err b { display: block; }
.hints { padding: 0 16px 12px; display: grid; gap: 6px; }
.hints:empty { display: none; }
.hint { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 0.9rem; }
.confirm { padding: 10px 16px; background: var(--warn-soft); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.9rem; }
.solution { padding: 0 16px 16px; }
.solution pre { margin: 0; }

/* ---------- widgets ---------- */
.widget { border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); padding: 14px 16px; display: grid; gap: 12px; }
.widget .wh { font: 600 0.72rem var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--copper); }
.widget .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.widget .scope { overflow-x: auto; background: var(--code-bg); border-radius: 6px; }
.widget svg text { font-family: var(--font-mono); }
.regbits { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.nib { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; }
.nib button { all: unset; cursor: pointer; text-align: center; font: 600 0.85rem var(--font-mono); padding: 6px 0 2px; border-radius: 4px; background: var(--code-bg); color: var(--ink-2); border: 1px solid transparent; }
.nib button[aria-pressed="true"] { background: var(--mask); color: var(--panel); }
.nib button.fld { border-color: var(--copper); }
.nib button:focus-visible { outline: 2px solid var(--copper); }
.nib small { display: block; font-size: 0.58rem; opacity: .75; padding-bottom: 2px; }
@media (max-width: 560px) { .regbits { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.readout { font: 0.95rem var(--font-mono); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.readout b { color: var(--mask); }
.seq { display: flex; flex-wrap: wrap; gap: 4px; }
.seq span { font: 600 0.78rem var(--font-mono); padding: 6px 8px; border-radius: 4px; border: 1px solid; }
.seq .c { border-color: var(--sig-ctrl); color: var(--sig-ctrl); background: var(--mask-soft); }
.seq .t { border-color: var(--sig-tgt); color: var(--sig-tgt); background: var(--copper-soft); }
.seq .cond { border-color: var(--ink-2); color: var(--ink); background: var(--paper); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.arb { border-collapse: collapse; font: 0.85rem var(--font-mono); }
.arb th, .arb td { padding: 4px 7px; text-align: center; border: 1px solid var(--rule); }
.arb td.out { color: var(--ink-2); opacity: .45; }
.arb td.lost { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.arb tr.bus td { background: var(--mask-soft); font-weight: 700; }
.arb tr.win th { color: var(--ok); }

/* ---------- sources ---------- */
.sources { display: grid; gap: 10px; }
.sources > h2 { font-size: 1.2rem; padding-top: 10px; border-top: 1px solid var(--rule); }
.sources ol { margin: 0; padding-left: 1.6em; display: grid; gap: 8px; font-size: 0.92rem; }
.sources li::marker { font-family: var(--font-mono); color: var(--copper); }
.sources .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--rule); }
.toast { position: fixed; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; z-index: 50; }
.section > *, .checkpoint > *, .widget > *, .ex > *, .q > *, .lesson-head > *, .hero > * { min-width: 0; }
code, pre, kbd, textarea, .gutter, .seq, .arb, .readout, input[type=text] { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
.subtoc li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 4px; align-items: center; padding-left: 8px; border-radius: 0 4px 4px 0; }
.subtoc li .mk { display: flex; }
.subtoc li.cur { background: var(--mask-soft); box-shadow: inset 2px 0 0 var(--mask); }
.subtoc li.cur button { color: var(--ink); font-weight: 600; }
.subtoc button { padding: 4px 6px; }
