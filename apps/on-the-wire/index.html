uint8_t swd_request(bool ap, bool read, uint8_t addr) {
    uint8_t a2 = (addr >> 2) & 1u, a3 = (addr >> 3) & 1u;
    uint8_t parity = (uint8_t)((ap + read + a2 + a3) & 1u);
    return (uint8_t)(1u                // start
        | ((uint8_t)ap << 1)
        | ((uint8_t)read << 2)
        | (a2 << 3) | (a3 << 4)
        | (parity << 5)
        | (0u << 6)                    // stop
        | (1u << 7));                  // park
}

bool swd_parity32(uint32_t v) {
    v ^= v >> 16;
    v ^= v >> 8;
    v ^= v >> 4;
    v ^= v >> 2;
    v ^= v >> 1;
    return v & 1u;
}

int swd_read(bool ap, uint8_t addr, uint32_t *value) {
    swd_send(swd_request(ap, true, addr), 8);
    swd_turnaround();
    uint32_t ack = swd_recv(3);
    if (ack != SWD_ACK_OK) {
        swd_turnaround();
        if (ack == SWD_ACK_WAIT || ack == SWD_ACK_FAULT) return (int)ack;
        return SWD_ERR_PROTOCOL;
    }
    uint32_t data = swd_recv(32);
    uint32_t parity = swd_recv(1);
    swd_turnaround();
    if (parity != (uint32_t)swd_parity32(data)) return SWD_ERR_PARITY;
    *value = data;
    return SWD_ACK_OK;
}

        const ack = s.nextAck.length ? s.nextAck.shift() : 1;
        const corrupt = s.nextCorrupt.length ? s.nextCorrupt.shift() : false;
        s.cur.ack = ack;
        s.ackBits = [ack & 1, (ack >> 1) & 1, (ack >> 2) & 1];

      {
        title: 'What is a microcontroller?',
        blocks: [
          { html: `<p>A <b>microcontroller</b> (MCU) is a complete small computer on one chip [[wiki-mcu]]. Inside the package you will find:</p>
<ul>
<li>a <b>CPU core</b>, such as an Arm Cortex-M4, that runs your code;</li>
<li><b>flash memory</b>, which holds your program and constant data and keeps them when the power is off;</li>
<li><b>SRAM</b>, the working memory for global variables, the stack and any heap, which is lost at power-off;</li>
<li>a clock system, reset and power-management circuits;</li>
<li>a set of hardware <b>peripherals</b>, which the next section covers.</li>
</ul>
<p>For instance, the STMicroelectronics STM32F401, a popular Cortex-M4 part, runs at 84 MHz with 512 KB of flash and 96 KB of SRAM. A laptop has roughly 100,000 times more RAM.</p>
<p><b>Microcontroller versus microprocessor.</b> The processor in a Raspberry Pi or a phone (a microprocessor, or MPU) needs external DRAM and storage chips and usually runs Linux. An MCU needs almost nothing outside it: give it power and a clock and it runs. MCUs typically cost a few dollars or less, start running code within milliseconds of power-up, and can sleep on microamps. That is why they sit in thermostats, keyboards, car door modules and battery-powered sensors.</p>
<p><b>What happens at power-up.</b> On a Cortex-M, the CPU reads two words from the start of memory, the <b>vector table</b>: the initial stack pointer and the address of the reset handler [[arm-m4-ug]]. The reset handler (startup code, usually supplied by the chip vendor) copies the initial values of global variables from flash into SRAM, zeroes the globals that have no initial value, and calls <code>main()</code>. In firmware, <code>main()</code> never returns.</p>
<p>Three things change when you move from desktop code to firmware:</p>
<ol>
<li><b>No operating system, or a tiny one.</b> Your code starts at reset and runs forever in a <code>while (1)</code> loop. Nothing will clean up after you, and there is often no <code>malloc</code>.</li>
<li><b>You drive hardware directly.</b> There is no driver layer between you and the silicon. Turning on an LED is a write to a specific address.</li>
<li><b>Time is part of correctness.</b> A motor controller that answers 2 ms late is broken, even if the answer is right.</li>
</ol>` },
          { q: { type: 'mcq', prompt: 'Your firmware declares the global <code>int retries = 5;</code>. While the program runs, where does <code>retries</code> live, and where did the 5 come from?', options: ['In flash; the compiler wrote 5 there and it changes in place', 'In SRAM; the startup code copied the 5 from flash before calling main()', 'In a CPU register for the whole program', 'On the stack of main()'], answer: 1, explain: 'Variables must be in writable SRAM. Flash keeps the initial value across power cycles, and the reset handler copies it into SRAM before main() runs.' } },
          { q: { type: 'mcq', prompt: 'A door sensor must run for two years on a coin cell and report "open" or "closed" over radio. Which is the better fit?', options: ['A microprocessor running Linux', 'A microcontroller that sleeps most of the time', 'A desktop CPU', 'Either; power draw is similar'], answer: 1, explain: 'An MCU can sleep at microamps and wake in microseconds. A Linux system needs external memory and draws far more power even when idle.' } },

      {
        title: 'Peripherals and registers',
        blocks: [
          { html: `<p>The CPU can run code, but on its own it can't measure a voltage, keep precise time or send a byte down a wire. Those jobs belong to <b>peripherals</b>: hardware blocks built into the chip, each doing one job by itself while the CPU gets on with other work. There are many kinds. A few examples are pins you can switch on and off, timers, circuits that measure voltages, and controllers for serial protocols like the ones this course covers.</p>
<p>You talk to every peripheral the same way: through its <b>registers</b>. A register is a small piece of storage inside the peripheral, usually 8, 16 or 32 bits wide, that the CPU can read and write. Most registers play one of three roles:</p>
<ol>
<li><b>Control</b> registers. You write them to tell the peripheral what to do, such as "turn on" or "use this speed".</li>
<li><b>Status</b> registers. You read them to find out what happened, such as "finished" or "new data waiting".</li>
<li><b>Data</b> registers. You write the data to send, or read the data that arrived.</li>
</ol>
<p>A typical exchange: write the control registers once to set the peripheral up, write a data register to start a job, then check a status register to learn when it is done. The rest of this lesson fills in the details: how to work with the individual bits inside a register (1.4), how C code reaches a register (1.5), and how a peripheral can notify the CPU instead of waiting to be checked (1.6).</p>` },
          { q: { type: 'mcq', prompt: 'Your thermostat needs to measure temperature from a sensor chip on the board. Which part of the MCU does the actual electrical communication with that chip?', options: ['The CPU core, by toggling its own pins directly', 'A communication peripheral built into the chip, set up by the CPU', 'The flash memory controller', 'The operating system\'s device driver'], answer: 1, explain: 'Peripherals do the electrical work, such as shifting bits out at exactly the right speed. The CPU sets them up and moves data in and out through their registers. Many MCUs have no operating system at all.' } },
        ],

      {
        title: 'Fixed-width integers and overflow',
        blocks: [
          { html: `<p>In C, <code>int</code> is only guaranteed to hold at least 16 bits [[c11-n1570]]. It is 32 bits on an Arm Cortex-M and 16 bits on an 8-bit AVR, like the one on classic Arduino boards. Hardware registers and protocol fields have exact sizes, so embedded code usually uses the exact-width types from <code>&lt;stdint.h&gt;</code> wherever size matters: registers, protocol fields, and data that crosses a wire or goes into storage [[cppref-int]]. Plain <code>int</code> is still fine for things like a small loop counter, as long as the values fit in 16 bits. Many teams go further: the widely used MISRA C guidelines recommend size-specific types throughout.</p>
<p>The common exact-width types:</p>
<table class="tbl"><tr><th>Type</th><th>Bits</th><th>Range</th></tr>
<tr><td><code>uint8_t</code></td><td>8</td><td>0 to 255</td></tr>
<tr><td><code>int8_t</code></td><td>8</td><td>−128 to 127</td></tr>
<tr><td><code>uint16_t</code></td><td>16</td><td>0 to 65,535</td></tr>
<tr><td><code>int16_t</code></td><td>16</td><td>−32,768 to 32,767</td></tr>
<tr><td><code>uint32_t</code></td><td>32</td><td>0 to 4,294,967,295</td></tr></table>
<p>Unsigned arithmetic <b>wraps</b>: it is defined to work modulo 2<sup>N</sup>. A <code>uint8_t</code> holding 250, plus 10, is 4. That is a bug if you are counting packets, and a feature if you want a free-running sequence counter. Signed overflow, by contrast, is <i>undefined behaviour</i> in C [[c11-n1570]]. The compiler may assume it never happens.</p>
<p>One more trap: in an expression, values smaller than <code>int</code> are first <b>promoted</b> to <code>int</code>. So <code>uint8_t a = 200, b = 100; if (a + b &gt; 255)</code> is true, because the addition happens in 32-bit <code>int</code>. The result only wraps when you store it back into a <code>uint8_t</code>.</p>` },
          { q: { type: 'num', prompt: 'A packet counter is declared <code>uint8_t count = 250;</code>. What does it hold after <code>count += 10;</code>?', answer: 4, tol: 0, explain: '250 + 10 = 260, and 260 mod 256 = 4. Unsigned types wrap modulo 2^N.' } },
          { q: { type: 'mcq', prompt: 'A sensor returns a 16-bit two\'s complement reading of 0xFFF4. Which declaration makes <code>reading</code> equal −12?', options: ['<code>uint16_t reading = 0xFFF4;</code>', '<code>int16_t reading = (int16_t)0xFFF4;</code>', '<code>int reading = 0xFFF4;</code>', '<code>uint32_t reading = 0xFFF4;</code>'], answer: 1, explain: 'Only a signed 16-bit type interprets bit 15 as the sign bit. A 32-bit int holds 0xFFF4 as 65,524.' } },

      {
        title: 'Bits, masks and fields',
        blocks: [
          { html: `<p>Hardware packs many settings into one register. A single 32-bit register might hold an enable bit, a 2-bit mode field and a 4-bit speed field. You manipulate them with <b>masks</b> [[wiki-mask]]:</p>
<pre class="code">reg |=  (1u &lt;&lt; 3);          // set bit 3
reg &amp;= ~(1u &lt;&lt; 3);          // clear bit 3
reg ^=  (1u &lt;&lt; 3);          // toggle bit 3
if (reg &amp; (1u &lt;&lt; 3)) { }    // test bit 3

// a 2-bit field at bits 11:10
#define MODE_POS   10u
#define MODE_MASK  (3u &lt;&lt; MODE_POS)   // 0b11 moved to bits 11:10 = 0x00000C00
reg &amp;= ~MODE_MASK;                    // clear both bits of the field
reg |=  (1u &lt;&lt; MODE_POS);             // write 0b01 into it</pre>
<p>The mask starts as <code>3u</code> (binary <code>11</code>) because the field is two bits wide. Shifting it by the field's position covers bits 11 and 10. Clearing first matters: <code>(1u &lt;&lt; 11)</code> alone would select only bit 11 and leave bit 10 holding whatever it had before. This is exactly what the GPIO mode register needs in section 1.5.</p>
<p>Write <code>1u</code>, not <code>1</code>. <code>1 &lt;&lt; 31</code> shifts into the sign bit of a signed int, which is undefined behaviour. Try the register explorer below. Click bits to flip them and watch the hex value change.</p>` },

<pre class="code">#include "bits.h"

uint32_t set_bit(uint32_t reg, uint8_t n);
uint32_t clear_bit(uint32_t reg, uint8_t n);
uint32_t toggle_bit(uint32_t reg, uint8_t n);

uint32_t read_field(uint32_t reg, uint8_t pos, uint8_t width);

<p class="muted">The header implements them as <code>static inline</code> functions, a common way to share small helpers without paying for a function call.</p>` },

      {
        title: 'Memory-mapped registers and volatile',
        blocks: [
          { html: `<p>How does a C program reach a peripheral? On Arm Cortex-M (and most MCUs) each peripheral's registers appear at fixed <b>memory addresses</b>. This is called memory-mapped I/O [[wiki-mmio]]. In the Cortex-M memory map, addresses 0x4000_0000 to 0x5FFF_FFFF are reserved for peripherals [[arm-m4-ug]]. The chip's reference manual lists each register's address and bit layout. In the STM32F4, GPIO port A starts at 0x4002_0000, and its mode register <code>MODER</code> sits at offset 0x00 [[st-rm0090]].</p>
<pre class="code">#include "bits.h"
// uint32_t write_field(uint32_t reg, uint8_t pos, uint8_t width, uint32_t value);
//   returns reg with the width-bit field starting at bit pos replaced by value

#define GPIOA_MODER (*(volatile uint32_t *)0x40020000u)
#define LED_PIN     5u

// Make pin PA5 an output. Each pin has a 2-bit mode field starting at bit (pin * 2),
// so PA5's field is bits 11:10, and 0b01 means output.
GPIOA_MODER = write_field(GPIOA_MODER, LED_PIN * 2u, 2u, 0b01);   // this store goes to silicon, not RAM</pre>
<p>Read the macro from the inside out: cast the number to a pointer to a 32-bit register, then dereference it. The result behaves like a variable, so the <code>bits.h</code> helpers from section 1.4 work on it directly.</p>
<p>The <code>volatile</code> keyword is essential. It tells the compiler that the value can change, or that reading and writing it has side effects, in ways the compiler cannot see [[cppref-volatile]][[c11-n1570]]. Without it, the optimizer may legally turn</p>
<pre class="code">while ((UART_SR &amp; TXE) == 0) { }   // wait for hardware</pre>
<p>into an infinite loop that reads the register only once. Use <code>volatile</code> for hardware registers, for variables shared with an interrupt handler, and for variables shared between RTOS tasks without other protection [[barr-volatile]]. It does <b>not</b> make an operation atomic.</p>
<div class="callout"><b>Read-modify-write.</b> <code>GPIOA_MODER |= x</code> compiles to three steps: load, OR, store. Anything that touches the same register between the load and the store, such as an interrupt, gets overwritten. That is why many MCUs add set/reset registers like the STM32's <code>BSRR</code>, where a single write changes only the bits you name [[st-rm0090]].</div>
<div class="callout"><b>Before a peripheral responds.</b> Two set-up steps come first on most MCUs, and forgetting them is the classic bring-up bug. First, <b>turn on its clock</b>: to save power, peripherals start switched off, and until you enable one in the clock controller (on the STM32F4, the RCC block), writes to it are ignored and reads return 0 [[st-rm0090]]. Second, <b>connect it to pins</b>: each pin can act as plain GPIO or be routed to one of several peripherals, its <i>alternate functions</i>. In this course's exercises, the board-support code has already done both.</div>` },
          { q: { type: 'multi', prompt: 'You write a byte to the UART\'s data register. Nothing appears on the TX pin, and reading the UART\'s control register back returns 0. What are the likely causes? Select all that apply.', options: ['The UART\'s peripheral clock was never enabled in the RCC', 'The TX pin is still configured as plain GPIO instead of the UART alternate function', 'The baud rate is wrong', 'The byte was not declared volatile'], answer: [0, 1], explain: 'A register that reads back as 0 after you wrote it points to a disabled clock. Even with the clock on, nothing reaches the pin until it is switched to the UART alternate function. A wrong baud rate would produce garbled characters, not silence.' } },

        title: 'Interrupts versus polling',
        blocks: [
          { html: `<p>Hardware events, like "a byte arrived" or "the timer expired", can be handled in two ways:</p>
<ol><li><b>Polling:</b> the main loop checks a status flag over and over. It is simple and predictable, but it wastes CPU time and can miss events if the loop is slow.</li>
<li><b>Interrupts:</b> the peripheral signals the CPU, which pauses the current code, runs an <b>interrupt service routine</b> (ISR), and then resumes [[wiki-isr]]. On Cortex-M, the NVIC (Nested Vectored Interrupt Controller) prioritises interrupt sources and lets a higher-priority interrupt pre-empt a lower one [[arm-m4-ug]].</li></ol>
<p>Rules of thumb for ISRs:</p>
<ol><li><b>Keep them short.</b> Copy the data somewhere, set a flag, and leave. While one ISR runs, other interrupts of the same or lower priority wait.</li>
<li><b>Never block.</b> No waiting loops, no <code>printf</code> to a slow UART, no <code>malloc</code>.</li>
<li><b>Share data carefully.</b> Variables shared with the main loop must be <code>volatile</code>. Multi-step updates also need protection, either by briefly disabling interrupts or with a design where only one side writes each variable. You will build the classic single-writer design, a ring buffer, in Lesson 3.</li></ol>` },
          { q: { type: 'multi', prompt: 'Which of these belong in a UART receive ISR? Select all that apply.', options: ['Read the received byte from the data register', 'Push the byte into a ring buffer', 'Parse the complete command and update the display', 'Wait for the next byte to arrive', 'Set a flag telling the main loop that data is waiting'], answer: [0, 1, 4], explain: 'Grab the data, store it, signal, and return. Parsing, display updates and waiting belong in the main loop.' } },

        blocks: [
          { html: `<p>A 32-bit value spans four bytes. <b>Little-endian</b> systems store the least significant byte at the lowest address. Cortex-M parts and x86 are usually little-endian. <b>Big-endian</b> systems store the most significant byte first, which is also called "network byte order" [[wiki-endian]].</p>
<pre class="code">value 0x12345678
little-endian bytes: 78 56 34 12
big-endian bytes:    12 34 56 78</pre>
<p>Protocols and sensors each pick an order, and datasheets tell you which. The ADXL345 accelerometer sends the low byte first [[adi-adxl345]]. The TMP102 temperature sensor sends the high byte first [[ti-tmp102]]. Avoid casting a byte buffer to <code>uint32_t*</code>: the result depends on the CPU's endianness, and it may fault on misaligned addresses. Assemble values with shifts, which work everywhere.</p>` },
          { ex: 'endian' },
          { html: `<p><b>Your toolkit: <code>endian.h</code>.</b> Like <code>bits.h</code>, these helpers come up in nearly every protocol driver, so the course provides a reference copy. Later exercises and code samples can use it with <code>#include "endian.h"</code>:</p>
<pre class="code">#include "endian.h"

uint16_t get_u16_le(const uint8_t *p);   uint16_t get_u16_be(const uint8_t *p);
uint32_t get_u32_le(const uint8_t *p);   uint32_t get_u32_be(const uint8_t *p);
void put_u16_le(uint8_t *p, uint16_t v); void put_u16_be(uint8_t *p, uint16_t v);
void put_u32_le(uint8_t *p, uint32_t v); void put_u32_be(uint8_t *p, uint32_t v);</pre>
<p class="muted">The header adds <code>put_u16_le</code> and <code>put_u32_be</code>, which the exercise did not ask for, so that every combination is covered.</p>` },

      { type: 'mcq', prompt: 'On a 16-bit AVR microcontroller, what is <code>sizeof(int)</code>?', options: ['1', '2', '4', '8'], answer: 1, explain: 'C only guarantees int is at least 16 bits. AVR compilers use 16-bit int, which is why embedded code prefers int32_t and friends.' },
      { type: 'text', prompt: 'Register <code>CTRL</code> holds 0x0000_00F0. What is its value, in hex, after <code>CTRL &amp;= ~(1u &lt;&lt; 5);</code>?', answer: ['0xD0', 'D0', '0x000000D0', '0xd0'], hex: true, explain: 'Bit 5 is 0x20. 0xF0 & ~0x20 = 0xD0.' },
      { type: 'mcq', prompt: 'Why does the STM32 provide a BSRR register when you could just write ODR?', options: ['BSRR is faster to type', 'A single write to BSRR changes only the named pins, so it cannot be corrupted by an interrupt touching other pins between a read and a write', 'ODR is read-only', 'BSRR also enables the clock'], answer: 1, explain: 'Writing BSRR is one atomic store. A read-modify-write of ODR can lose updates made by an ISR in between.' },

  L.push({
    id: 'serial',
    title: 'Serial communication fundamentals',
    tagline: 'Clocks, framing, topologies, voltage levels and error detection, before any specific protocol.',
    minutes: 40,
    scenario: `The thermostat now needs to talk to a temperature sensor 5 cm away, a Wi-Fi module on the same board, and the building's HVAC controller 80 metres down a hallway. Each link calls for a different protocol. This lesson gives you the vocabulary to understand why.`,
    sections: [
      {
        title: 'Why serial?',
        blocks: [
          { html: `<p>A <b>parallel</b> bus sends many bits at once over many wires. A <b>serial</b> link sends them one after another over one or two data wires [[sparkfun-serial]]. Parallel looks faster, but every pin costs package size, board area and money, and at high speed the wires' small timing differences (skew) make it hard to sample all bits at once. Today almost every chip-to-chip and board-to-board link is serial.</p>
<p>Some vocabulary you will use in every lesson:</p>
<ul><li><b>Bit rate</b> (bits per second) and <b>baud</b> (symbols per second). For the simple two-level signals in this course, they are equal.</li>
<li><b>Bit time</b> = 1 / bit rate. At 115,200 bit/s, one bit lasts about 8.68 µs.</li>
<li><b>Frame</b>: the unit a protocol wraps around your data, with start markers, addresses, checksums and so on.</li></ul>` },
        ],
      },
      {
        title: 'Synchronous versus asynchronous',
        blocks: [
          { html: `<p>A receiver has to know <i>when</i> to look at the data line. There are two strategies:</p>
<table class="tbl"><tr><th></th><th>Synchronous</th><th>Asynchronous</th></tr>
<tr><td>How the receiver knows when to sample</td><td>A separate <b>clock</b> wire. Data is sampled on a clock edge.</td><td>Both sides agree on a bit rate in advance and re-align on known edges in the data.</td></tr>
<tr><td>Clock accuracy needed</td><td>None. The controller can even pause the clock.</td><td>Both clocks must be close, typically within a few percent.</td></tr>
<tr><td>Examples</td><td>SPI, I²C</td><td>UART, CAN</td></tr></table>
<p>UART re-aligns on the start bit of every byte. CAN re-aligns on the edges in the bitstream, and inserts extra "stuff bits" to guarantee edges occur often enough [[ti-sloa101]].</p>` },
          { q: { type: 'mcq', prompt: 'An SPI controller is interrupted mid-transfer and stops toggling the clock for 50 µs. What happens to the transfer?', options: ['It fails: the target times out after one bit time', 'Nothing: the target only acts on clock edges, so the transfer simply pauses', 'The target switches to asynchronous mode', 'Data is corrupted unless parity is enabled'], answer: 1, explain: 'In a synchronous protocol the clock defines time. No edges means no bits, so the target waits.' } },
        ],
      },
      {
        title: 'Topology, roles and duplex',
        blocks: [
          { html: `<ul><li><b>Point-to-point</b> links connect exactly two devices (UART). A <b>bus</b> connects many devices to shared wires, so it needs addressing (I²C) or chip-select lines (SPI) or message IDs (CAN).</li>
<li><b>Controller and target.</b> On SPI and I²C, one controller starts every transfer and drives the clock. Older documents call these roles master and slave, and the newer specifications have renamed them [[nxp-um10204]]. CAN is <b>multi-master</b>: any node may start transmitting when the bus is idle.</li>
<li><b>Duplex.</b> <i>Full duplex</i> means both directions at once (UART has separate TX and RX wires, and SPI shifts in and out simultaneously). <i>Half duplex</i> means one direction at a time over shared wires (I²C, CAN, RS-485).</li></ul>` },
          { q: { type: 'mcq', prompt: 'Which protocol lets a node start a transmission without any controller giving permission?', options: ['SPI', 'I²C target device', 'CAN', 'None of them'], answer: 2, explain: 'CAN is multi-master. Collisions are resolved by bitwise arbitration on the message ID (Lesson 6).' } },
        ],
      },
      {
        title: 'The physical layer: voltages and drivers',
        blocks: [
          { html: `<p>Bits are voltages, and voltages pick up noise. Three ideas explain most of the hardware you will meet:</p>
<p><b>Single-ended vs differential.</b> A single-ended signal is measured against ground. That is cheap and fine across a circuit board (UART at 3.3 V logic, SPI, I²C). A <b>differential</b> pair sends the signal on two wires as a voltage <i>difference</i>, so noise that hits both wires equally cancels out [[wiki-differential]]. That is how RS-485 reaches up to 1,200 m [[ti-slla272]] and how CAN survives inside a car [[ti-slla270]].</p>
<p><b>Push-pull vs open-drain.</b> A push-pull output actively drives both high and low. An <b>open-drain</b> output can only pull the line low; a resistor pulls it high when nobody is driving [[wiki-opencollector]]. Connect several open-drain outputs together and the line is low if <i>any</i> device pulls it low. This "wired-AND" behaviour lets I²C devices share a wire without short circuits, and it is the basis of CAN arbitration.</p>
<p><b>Levels are not universal.</b> "RS-232" serial ports use roughly ±3 to ±15 V and invert the logic, so a negative voltage means 1 [[adi-rs232]]. Connecting an RS-232 port straight to a 3.3 V MCU pin can destroy the pin. A transceiver chip converts between the two.</p>` },
          { q: { type: 'mcq', prompt: 'Two open-drain devices share a line with a pull-up resistor. Device A releases the line (wants 1) while device B pulls it low (wants 0). What level does the line have?', options: ['High', 'Low', 'Halfway, which is undefined', 'It depends on which device spoke first'], answer: 1, explain: 'Open-drain lines are wired-AND: any device pulling low wins, and nobody is damaged.' } },
        ],
      },
      {
        title: 'Detecting errors',
        blocks: [
          { html: `<p>Noise flips bits. Protocols add redundancy so the receiver can notice:</p>
<ul><li><b>Parity</b>: one extra bit makes the count of 1s even (or odd). It detects any single-bit error, but misses two flipped bits [[wiki-parity]].</li>
<li><b>Checksum</b>: a sum or XOR of the bytes. Cheap, but weak against some error patterns, such as two errors that cancel out.</li>
<li><b>CRC</b> (cyclic redundancy check): the data is treated as a polynomial and divided by a generator polynomial. The remainder is the check value [[wiki-crc]]. A CRC detects all burst errors shorter than its width. SMBus uses CRC-8 with polynomial 0x07 [[smbus-3.2]], and CAN uses a 15-bit CRC [[ti-sloa101]].</li></ul>
<p>Detection is not correction. The protocol must also decide what happens next: drop the frame, request a retry (I²C NACK, Modbus), or retransmit automatically (CAN).</p>` },
          { ex: 'parity' },
        ],
      },
      {
        title: 'Choosing a protocol',
        blocks: [
          { html: `<p>Here is where this course is heading. Keep this table in mind: an interviewer will often ask why a design used one protocol and not another.</p>
<div class="tblwrap"><table class="tbl"><tr><th></th><th>UART</th><th>SPI</th><th>I²C</th><th>CAN</th></tr>
<tr><td>Wires (plus ground)</td><td>2 (TX, RX)</td><td>4: SCLK, MOSI, MISO, plus 1 CS per target</td><td>2 (SDA, SCL)</td><td>2 (CAN_H, CAN_L)</td></tr>
<tr><td>Clocking</td><td>Async</td><td>Sync</td><td>Sync</td><td>Async</td></tr>
<tr><td>Typical speed</td><td>9.6 to 921.6 kbit/s</td><td>1 to 50+ MHz</td><td>100 kHz, 400 kHz, 1 MHz</td><td>125 kbit/s to 1 Mbit/s (CAN FD faster)</td></tr>
<tr><td>Devices</td><td>2</td><td>1 controller, several targets</td><td>Up to ~112 addresses</td><td>Many nodes, multi-master</td></tr>
<tr><td>Error detection</td><td>Optional parity</td><td>None built in</td><td>ACK/NACK per byte</td><td>CRC, ACK, error counters, automatic retransmit</td></tr>
<tr><td>Typical use</td><td>Debug consoles, GPS, modems</td><td>Flash, displays, fast ADCs</td><td>Sensors, EEPROMs, power chips</td><td>Vehicles, industrial machines</td></tr></table></div>
<p class="muted">Speeds and limits are typical values; each lesson cites the specification.</p>` },
          { q: { type: 'num', prompt: 'A UART runs at 115,200 baud with 8N1 framing: 1 start bit, 8 data bits, no parity, 1 stop bit. What is the maximum payload throughput in bytes per second?', answer: 11520, tol: 0, unit: 'bytes/s', explain: 'Each byte costs 10 bit times. 115,200 / 10 = 11,520 bytes/s, so 20% of the line goes to framing.' } },
        ],
      },
    ],
    quiz: [
      { type: 'mcq', prompt: 'Why does an asynchronous receiver need an accurate clock while a synchronous one does not?', options: ['Async receivers decide when to sample by counting time from a known edge, so clock error accumulates within a frame', 'Async protocols are faster', 'Synchronous receivers have no clock at all', 'Async lines use differential signalling'], answer: 0, explain: 'With no clock wire, the receiver times each bit itself. Any rate mismatch shifts the sample point a little more with every bit.' },
      { type: 'multi', prompt: 'Which links are half duplex? Select all that apply.', options: ['I²C', 'SPI', 'CAN', 'UART with separate TX and RX wires'], answer: [0, 2], explain: 'I²C and CAN share one data path. SPI and UART move data in both directions at once.' },
      { type: 'mcq', prompt: 'You must link two controllers 300 m apart in a factory full of motors. Which physical layer fits best?', options: ['3.3 V single-ended UART', 'I²C with stronger pull-ups', 'A differential transceiver such as RS-485', 'SPI at a low clock rate'], answer: 2, explain: 'Long cables in a noisy environment call for differential signalling. RS-485 is specified for up to 1,200 m.' },
      { type: 'mcq', prompt: 'Even parity is in use. The receiver gets data 0x6B with parity bit 1. Is the byte consistent?', options: ['Yes', 'No'], answer: 0, explain: '0x6B = 0110 1011 has five 1s. With the parity bit 1 that makes six, which is even.' },
      { type: 'mcq', prompt: 'What does a CRC give you that a single parity bit does not?', options: ['Error correction', 'Detection of multi-bit and burst errors', 'Encryption', 'Higher bit rate'], answer: 1, explain: 'A well-chosen CRC detects all bursts shorter than its width and most longer patterns. Parity misses any even number of flipped bits.' },
      { type: 'num', prompt: 'How long is one bit time at 9600 bit/s, in microseconds? Round to the nearest whole number.', answer: 104, tol: 0.6, unit: 'µs', explain: '1 / 9600 s = 104.17 µs.' },
    ],
    challenge: 'crc8',
    challengeIntro: 'Implement the CRC that SMBus devices use for Packet Error Checking [[smbus-3.2]].',
    sources: ['sparkfun-serial', 'ti-sloa101', 'nxp-um10204', 'wiki-differential', 'ti-slla272', 'ti-slla270', 'wiki-opencollector', 'adi-rs232', 'wiki-parity', 'wiki-crc', 'smbus-3.2'],

  /* ======================= LESSON 3 ======================= */
  L.push({
    id: 'uart',
    title: 'UART: the simplest serial link',
    tagline: 'Start bits, baud-rate error, polled drivers, ring buffers and packet framing.',
    minutes: 50,
    scenario: `The thermostat has a debug header with two pins labelled TX and RX. A field technician plugs in a USB-to-serial cable and expects a console. A GPS module on another product streams position packets over the same kind of link. Both are UARTs, the oldest and most common serial interface in embedded systems.`,
    sections: [
      {
        title: 'The UART frame',
        blocks: [
          { html: `<p>A UART (universal asynchronous receiver-transmitter) sends each byte as a small self-contained frame [[wiki-uart]]:</p>
<ol><li>The line <b>idles high</b> (logic 1).</li>
<li>A <b>start bit</b> (0) marks the beginning. The falling edge tells the receiver to start timing.</li>
<li>5 to 9 <b>data bits</b>, <b>least significant bit first</b>.</li>
<li>An optional <b>parity</b> bit.</li>
<li>One or two <b>stop bits</b> (1), which return the line to idle and guarantee a falling edge before the next start bit.</li></ol>
<p>Settings are written as shorthand: <b>115200 8N1</b> means 115,200 baud, 8 data bits, no parity, 1 stop bit. Both ends must be configured identically. There is no negotiation. Try a few characters in the visualizer.</p>` },
          { widget: 'uart' },
          { q: { type: 'mcq', prompt: 'A logic analyser shows the line idle-high, then low for one bit time, then data bits <code>1 0 0 0 0 0 1 0</code>, then high. Which ASCII character was sent?', options: ['0x82', 'A (0x41)', 'B (0x42)', '0x41 inverted'], answer: 1, explain: 'Data is LSB first. Reversing 1000 0010 gives 0100 0001 = 0x41 = "A".' } },
        ],
      },
      {
        title: 'Baud rate and clock error',
        blocks: [
          { html: `<p>The receiver samples each bit near its middle. Most UARTs <b>oversample</b>: they run a clock at 16× the baud rate, detect the start edge, and then sample at counts 8, 24, 40 and so on [[st-rm0090]]. Because they re-sync on every start bit, timing error only builds up across one frame. With a 10-bit frame the last sample must still land inside the stop bit. In theory that allows a total transmitter-plus-receiver mismatch of about 5%. In practice designers keep each side well under 2% to leave margin for edge distortion [[adi-uart-clock]].</p>
<p>The baud rate comes from dividing the peripheral clock. With 16× oversampling:</p>
<pre class="code">divisor = f_clk / (16 × baud)</pre>
<p>Example: a 16 MHz clock at 115,200 baud needs a divisor of 8.68. A UART that only supports integer divisors must use 9, giving 16,000,000 / (16 × 9) = 111,111 baud, which is 3.5% slow. That is enough to cause garbled characters. This is why MCUs offer fractional dividers, and why "baud-friendly" crystals like 14.7456 MHz exist (14,745,600 / 16 / 115,200 = exactly 8).</p>` },
          { q: { type: 'num', prompt: 'An 8 MHz UART clock with an integer divisor and 16× oversampling is set to 38,400 baud. The divisor 8e6 / (16 × 38400) = 13.02 rounds to 13. What is the actual baud rate? Round to the nearest whole number.', answer: 38462, tol: 1, unit: 'baud', explain: '8,000,000 / (16 × 13) = 38,461.5 baud, an error of +0.16%. That is fine.' } },
          { q: { type: 'mcq', prompt: 'A console prints garbage, but the garbage is consistent: the same wrong characters every time. What should you check first?', options: ['The CRC polynomial', 'Baud rate and frame format on both ends', 'The I²C pull-up resistors', 'Whether the stack is large enough'], answer: 1, explain: 'Repeatable garbage is the classic symptom of mismatched baud rate, data bits, parity or stop bits.' } },
        ],
      },
      {
        title: 'Writing a polled driver',
        blocks: [
          { html: `<p>A UART peripheral exposes a few registers. On the STM32F4 these include [[st-rm0090]]:</p>
<ul><li><code>DR</code>, the data register. Writing queues a byte to transmit. Reading returns the last received byte.</li>
<li><code>SR</code>, the status register. <b>TXE</b> (bit 7) = transmit data register empty, so you may write the next byte. <b>RXNE</b> (bit 5) = a received byte is waiting. <b>ORE</b> = overrun: a new byte arrived before you read the last one, so it was lost.</li></ul>
<p>The simplest driver polls those flags. It is easy to get right and perfectly fine for a debug console. Its weakness is that the CPU does nothing else while it waits: at 115,200 baud, one character takes 87 µs, which is over 7,000 clock cycles at 84 MHz.</p>` },
          { ex: 'uart-tx' },
        ],
      },
      {
        title: 'Interrupt-driven receive and ring buffers',
        blocks: [
          { html: `<p>Polling RXNE fails as soon as the main loop gets busy. At 115,200 baud a new byte arrives every 87 µs. If the loop spends 1 ms updating a display, eleven bytes arrive and all but one are lost to overrun.</p>
<p>The standard fix: enable the RXNE interrupt. The ISR reads <code>DR</code>, pushes the byte into a <b>ring buffer</b> (circular buffer), and returns within a microsecond or two. The main loop drains the buffer when it has time [[wiki-circbuf]].</p>
<pre class="code">void USART2_IRQHandler(void) {
    if (USART2_SR &amp; USART_SR_RXNE) {
        rb_put(&amp;rx_buf, (uint8_t)USART2_DR);   // reading DR clears RXNE
    }
}

int main(void) {
    for (;;) {
        uint8_t b;
        while (rb_get(&amp;rx_buf, &amp;b)) handle_byte(b);
        update_display();
    }
}</pre>
<p>With exactly one producer (the ISR writes <code>head</code>) and one consumer (the main loop writes <code>tail</code>), no locking is needed, provided each index is read and written in one access and the data is stored before the index is published.</p>` },
          { ex: 'ringbuf' },
        ],
      },
      {
        title: 'Framing packets on a byte stream',
        blocks: [
          { html: `<p>A UART delivers bytes with no idea where a "message" starts or ends. Higher-level protocols add their own framing. Common patterns:</p>
<ul><li><b>Delimiters</b>: text protocols end lines with <code>\\r\\n</code>. NMEA GPS sentences start with <code>$</code> and end with a checksum and CRLF.</li>
<li><b>Sync byte + length + checksum</b>: binary protocols. The receiver hunts for the sync byte, reads a length, collects that many bytes, and verifies the checksum.</li>
<li><b>Silence</b>: Modbus RTU separates frames with idle gaps of at least 3.5 character times.</li></ul>
<p>Whatever the format, the parser is a <b>state machine</b> fed one byte at a time. It must recover from anything: a missing byte, a corrupted length, or joining a stream halfway through a packet.</p>
<div class="callout"><b>RS-232 and RS-485.</b> UART is a frame format, not a voltage. Over a board you use 3.3 V logic levels. Across a room you might use RS-232 transceivers [[adi-rs232]]. For long multi-drop industrial links, RS-485 transceivers carry the same UART frames on a differential pair, with up to 32 standard unit loads on one bus [[ti-slla272]][[wiki-rs485]].</div>` },
        ],
      },
    ],
    quiz: [
      { type: 'mcq', prompt: 'In which order are the data bits of a UART frame transmitted?', options: ['Most significant bit first', 'Least significant bit first', 'It depends on the parity setting', 'Even bits, then odd bits'], answer: 1, explain: 'UARTs send LSB first. SPI and I²C usually send MSB first, which is a frequent source of confusion.' },
      { type: 'num', prompt: 'How many bit times does one byte take in 9600 7E2 format (7 data bits, even parity, 2 stop bits)?', answer: 11, tol: 0, unit: 'bits', explain: '1 start + 7 data + 1 parity + 2 stop = 11 bit times.' },
      { type: 'mcq', prompt: 'Your RX ISR occasionally runs late, and the status register shows ORE set. What happened?', options: ['The baud rate is wrong', 'A new byte arrived before the previous one was read, and a byte was lost', 'The parity bit was wrong', 'The transmitter is still busy'], answer: 1, explain: 'Overrun means the receive register was overwritten. Fix it by servicing RXNE faster, using a larger FIFO or DMA, or adding flow control.' },
      { type: 'mcq', prompt: 'A ring buffer of size 16 uses the "one empty slot" convention. How many bytes can it hold?', options: ['16', '15', '8', '17'], answer: 1, explain: 'One slot stays empty so head == tail always means empty, never full.' },
      { type: 'mcq', prompt: 'Why does the UART receiver re-synchronise on every start bit?', options: ['To detect parity errors', 'So clock mismatch only accumulates over one frame instead of the whole message', 'To change baud rate on the fly', 'Because stop bits are optional'], answer: 1, explain: 'Each start edge resets the receiver\'s timing, so a 1% error only shifts the last sample of a 10-bit frame by about 10% of a bit.' },
      { type: 'multi', prompt: 'You connect a laptop\'s DB-9 RS-232 port to an MCU\'s UART pins through a straight cable. Which problems should you expect? Select all that apply.', options: ['The voltage levels are inverted (negative = 1)', 'The voltages can exceed what the MCU pin tolerates', 'Nothing; UART is UART', 'The MCU will receive data MSB first'], answer: [0, 1], explain: 'RS-232 uses inverted ±3 to ±15 V levels. You need a transceiver such as a MAX3232 between them.' },
    ],
    challenge: 'packet',
    challengeIntro: 'Build a parser that survives real-world byte streams: noise, corruption and back-to-back packets.',
    sources: ['wiki-uart', 'st-rm0090', 'adi-uart-clock', 'wiki-circbuf', 'adi-rs232', 'ti-slla272', 'wiki-rs485', 'sparkfun-serial'],
  });

(function (root) {

  /* ======================= LESSON 4: SPI ======================= */
  L.push({
    id: 'spi',
    title: 'SPI: fast, simple, full duplex',
    tagline: 'Shift registers, chip selects, clock modes and reading a real sensor.',
    minutes: 45,
    scenario: `A fitness tracker samples a 3-axis accelerometer 100 times a second and logs to an external flash chip. Both hang off the same four-wire bus. SPI is the go-to choice when you need speed and a simple protocol, and you can spare a few pins.`,
    sections: [
      {
        title: 'Four wires and a shift register',
        blocks: [
          { html: `<p>SPI (Serial Peripheral Interface) was introduced by Motorola. It has no formal standard body, so each datasheet specifies its own details [[wiki-spi]]. The signals are [[adi-spi]]:</p>
<table class="tbl"><tr><th>Signal</th><th>Also called</th><th>Driven by</th><th>Purpose</th></tr>
<tr><td>SCLK</td><td>SCK</td><td>Controller</td><td>Clock</td></tr>
<tr><td>MOSI</td><td>COPI, SDO (on controller)</td><td>Controller</td><td>Data to the target</td></tr>
<tr><td>MISO</td><td>CIPO, SDI (on controller)</td><td>Selected target</td><td>Data to the controller</td></tr>
<tr><td>CS</td><td>SS, nCS, CE</td><td>Controller</td><td>Selects one target. Usually <b>active low</b>.</td></tr></table>
<p>Inside, both sides hold a <b>shift register</b>. Every clock pulse shifts one bit out of the controller into the target on MOSI, and one bit out of the target into the controller on MISO, at the same time. After 8 clocks the two bytes have swapped places [[sparkfun-spi]]. Consequences:</p>
<ul><li>SPI is <b>always full duplex</b>. To read, you must send something, usually a dummy byte like 0x00 or 0xFF.</li>
<li>There is <b>no addressing</b> on the wires. Each target has its own CS line, and a target whose CS is high must leave MISO floating (high-impedance).</li>
<li>There is <b>no acknowledgement</b>. If the target is missing or broken, you read 0xFF or 0x00 and nothing complains. Good drivers read an ID register at start-up to confirm the device is there.</li></ul>` },
          { q: { type: 'mcq', prompt: 'You need to read one byte from an SPI sensor. How many bytes does the controller send?', options: ['Zero: SPI targets push data when ready', 'At least as many as it wants to receive, because every received bit is clocked by a sent bit', 'Exactly one address byte', 'It depends on the ACK'], answer: 1, explain: 'The controller generates every clock edge, and every edge moves one bit each way. Reading requires transmitting.' } },
        ],
      },
      {
        title: 'Clock polarity and phase (SPI modes)',
        blocks: [
          { html: `<p>Two settings decide when data is valid [[adi-spi]]:</p>
<ul><li><b>CPOL</b> (clock polarity): the clock's idle level. 0 = idles low, 1 = idles high.</li>
<li><b>CPHA</b> (clock phase): which edge samples data. 0 = the first (leading) edge, 1 = the second (trailing) edge. Data changes on the opposite edge.</li></ul>
<table class="tbl"><tr><th>Mode</th><th>CPOL</th><th>CPHA</th><th>Clock idles</th><th>Sample on</th></tr>
<tr><td>0</td><td>0</td><td>0</td><td>Low</td><td>Rising edge</td></tr>
<tr><td>1</td><td>0</td><td>1</td><td>Low</td><td>Falling edge</td></tr>
<tr><td>2</td><td>1</td><td>0</td><td>High</td><td>Falling edge</td></tr>
<tr><td>3</td><td>1</td><td>1</td><td>High</td><td>Rising edge</td></tr></table>
<p>The target's datasheet tells you the mode. The ADXL345 accelerometer uses mode 3, for example [[adi-adxl345]]. Get it wrong and you read data shifted by one bit, which often looks almost right (values doubled or halved), and that makes the bug hard to spot.</p>` },
          { widget: 'spi' },
          { q: { type: 'mcq', prompt: 'A datasheet says: "SCLK idles high; data is latched on the rising edge." Which SPI mode is that?', options: ['Mode 0', 'Mode 1', 'Mode 2', 'Mode 3'], answer: 3, explain: 'Idle high means CPOL = 1. From idle high, the first edge is falling, so a rising-edge sample is the second edge: CPHA = 1. That is mode 3.' } },
        ],
      },
      {
        title: 'Transactions: command, address, data',
        blocks: [
          { html: `<p>Since SPI itself only moves bits, each device defines its own transaction format on top. A very common pattern is a command byte followed by data, all framed by one CS-low period:</p>
<pre class="frame">CS ↓   [cmd/addr]  [data 0]  [data 1] …   CS ↑</pre>
<p>For the ADXL345 the first byte holds a read/write bit (bit 7), a multi-byte bit (bit 6) and a 6-bit register address [[adi-adxl345]]. SPI NOR flash chips use command opcodes instead, such as <code>0x9F</code> to read the JEDEC manufacturer and device ID, and <code>0x03</code> to read data.</p>
<p>Raising CS is meaningful: it ends the command, and many devices only act on a write when CS goes high. Never leave CS low between unrelated transactions, and make sure only one target's CS is low at a time.</p>
<div class="callout"><b>Multiple targets.</b> The usual wiring gives each target its own CS pin. Some parts support <b>daisy-chaining</b>: MISO of one feeds MOSI of the next, sharing a single CS. This is common for LED drivers and shift registers [[adi-an1248]].</div>` },
          { ex: 'adxl' },
        ],
      },
      {
        title: 'Practical limits',
        blocks: [
          { html: `<ul><li><b>Clock speed</b> is limited by the slowest part and by the board. The ADXL345 allows up to 5 MHz [[adi-adxl345]], while SPI flash commonly runs at 50 to 133 MHz. Long wires and many targets add capacitance and reflections, so drop the clock if you see corrupted bits.</li>
<li><b>Timing parameters</b> in the datasheet, such as CS setup time before the first clock and hold time after the last, matter at high speed.</li>
<li><b>DMA</b> (direct memory access) is the norm for big transfers. The CPU sets up a buffer and the hardware streams it out while code keeps running.</li>
<li><b>Variants:</b> Dual and Quad SPI use 2 or 4 data lines for flash memory. 3-wire SPI shares one bidirectional data line.</li></ul>` },
          { q: { type: 'mcq', prompt: 'At power-up, your driver reads the ADXL345 DEVID register and gets 0xFF instead of 0xE5. What is the most likely explanation?', options: ['The sensor sent an ACK', 'Nothing drove MISO: the chip is not selected, not powered or not connected, and the line floated or was pulled high', 'The device is in measurement mode', 'SPI is little-endian'], answer: 1, explain: 'SPI has no ACK. An absent device typically reads as all ones or all zeros, which is why drivers check an ID register first.' } },
        ],
      },
    ],
    quiz: [
      { type: 'mcq', prompt: 'What is the main way SPI selects which device is being addressed?', options: ['A 7-bit address in the first byte', 'A dedicated chip-select line per target', 'Message ID arbitration', 'The clock frequency'], answer: 1, explain: 'SPI has no in-band addressing. The controller pulls one target\'s CS low.' },
      { type: 'multi', prompt: 'Which statements about SPI are true? Select all that apply.', options: ['Data moves in both directions on every clock', 'The target can start a transfer when it has data', 'There is no built-in acknowledgement or error check', 'CPOL sets the idle level of the clock'], answer: [0, 2, 3], explain: 'Only the controller can clock the bus. Targets usually signal "data ready" through a separate interrupt pin.' },
      { type: 'mcq', prompt: 'In mode 0 (CPOL = 0, CPHA = 0), when must the controller put the next bit on MOSI?', options: ['While the clock is high', 'Before the rising edge, while the clock is low', 'Exactly on the rising edge', 'Only after CS goes high'], answer: 1, explain: 'Mode 0 samples on the rising edge, so data must be stable before it. Data changes on the falling edge.' },
      { type: 'text', prompt: 'ADXL345: what command byte (in hex) starts a <b>multi-byte read</b> beginning at register 0x32?', answer: ['0xF2', 'F2'], hex: true, explain: 'Read bit 0x80 | multi-byte bit 0x40 | 0x32 = 0xF2.' },
      { type: 'mcq', prompt: 'Readings from an SPI ADC are consistently about twice the expected value, and the top bit sometimes looks wrong. What should you suspect first?', options: ['Wrong SPI mode, so data is sampled one bit late', 'Wrong I²C address', 'Missing pull-up resistors', 'Wrong baud rate'], answer: 0, explain: 'Sampling on the wrong edge shifts every bit by one position, which looks like ×2 or ÷2.' },
      { type: 'num', prompt: 'You stream 6-byte ADXL345 samples (plus 1 command byte each) at 5 MHz SCLK with no gaps. How long does one transaction take, in microseconds? Round to one decimal place.', answer: 11.2, tol: 0.05, unit: 'µs', explain: '7 bytes × 8 bits = 56 clocks. 56 / 5 MHz = 11.2 µs.' },
    ],
    challenge: 'bitbang',
    challengeIntro: 'Generate SPI mode 0 yourself, edge by edge. This is the best way to really understand CPOL and CPHA [[sparkfun-spi]].',
    sources: ['wiki-spi', 'adi-spi', 'sparkfun-spi', 'adi-adxl345', 'adi-an1248'],
  });

  /* ======================= LESSON 5: I2C ======================= */
  L.push({
    id: 'i2c',
    title: 'I²C: two wires, many devices',
    tagline: 'Open-drain signalling, START/STOP, addressing, ACK/NACK, pull-ups and real device quirks.',
    minutes: 55,
    scenario: `The thermostat's board has a temperature sensor, a humidity sensor, an EEPROM for calibration data and a power-management chip. The MCU has spare pins for exactly two of them. I²C (Inter-Integrated Circuit, invented by Philips, now NXP) connects all four with just two wires.`,
    sections: [
      {
        title: 'The two wires',
        blocks: [
          { html: `<p>I²C uses <b>SDA</b> (serial data) and <b>SCL</b> (serial clock). Both are <b>open-drain</b>: devices can only pull them low, and a pull-up resistor on each line brings it high [[nxp-um10204]]. This gives I²C its key properties:</p>
<ul><li>Any number of devices share the wires without short circuits.</li>
<li>A target can hold SCL low to make the controller wait. This is <b>clock stretching</b>.</li>
<li>Several controllers can share the bus and arbitrate, much like CAN.</li></ul>
<p>Speed grades from the specification [[nxp-um10204]]:</p>
<table class="tbl"><tr><th>Mode</th><th>Max bit rate</th></tr>
<tr><td>Standard-mode (Sm)</td><td>100 kbit/s</td></tr>
<tr><td>Fast-mode (Fm)</td><td>400 kbit/s</td></tr>
<tr><td>Fast-mode Plus (Fm+)</td><td>1 Mbit/s</td></tr>
<tr><td>High-speed mode (Hs)</td><td>3.4 Mbit/s</td></tr></table>
<p>I²C is meant for short distances on one board. Total bus capacitance is limited to 400 pF in standard and fast mode [[nxp-um10204]].</p>` },
        ],
      },
      {
        title: 'START, address, ACK, STOP',
        blocks: [
          { html: `<p>Data on SDA may only change while SCL is <b>low</b>. Two special conditions break that rule on purpose [[ti-slva704]]:</p>
<ul><li><b>START (S)</b>: SDA falls while SCL is high. The bus is now busy.</li>
<li><b>STOP (P)</b>: SDA rises while SCL is high. The bus is free.</li>
<li><b>Repeated START (Sr)</b>: a START without a preceding STOP, used to change direction without releasing the bus.</li></ul>
<p>After a START, the controller sends a byte containing a <b>7-bit address</b> and a <b>R/W bit</b> (0 = write, 1 = read). Data is sent MSB first. After every byte, the receiver drives the 9th clock's SDA: <b>low = ACK</b> ("got it, continue") or left <b>high = NACK</b>. A NACK after an address means no device answered. A NACK from the controller after a read byte means "that was the last one".</p>
<p>Build a transaction below. The colours show who drives SDA at each moment.</p>` },
          { widget: 'i2c' },
          { q: { type: 'text', prompt: 'A sensor\'s datasheet gives its 7-bit address as 0x48. What byte (in hex) goes on the wire to <b>read</b> from it?', answer: ['0x91', '91'], hex: true, explain: '(0x48 << 1) | 1 = 0x91. Some datasheets list "8-bit addresses" 0x90/0x91 instead, so always check which convention is used.' } },
          { q: { type: 'mcq', prompt: 'Why does the controller NACK the last byte of a read?', options: ['To signal an error', 'To tell the target to stop sending and release SDA so the controller can generate STOP', 'It is optional politeness', 'To request a retransmit'], answer: 1, explain: 'If the controller ACKs, the target will drive the next data bit onto SDA and may block the STOP condition.' } },
        ],
      },
      {
        title: 'The register-access pattern',
        blocks: [
          { html: `<p>Most I²C devices expose numbered registers behind an internal <b>pointer</b>. Reading register R is therefore a write followed by a read [[ti-slva704]]:</p>
<pre class="frame">S [addr+W] A [R] A Sr [addr+R] A [data] A [data] NACK P</pre>
<p>The TMP102 temperature sensor is a clean example. Its 7-bit address is 0x48 to 0x4B depending on how the ADD0 pin is wired. Pointer 0x00 is the temperature register and 0x01 is configuration. Temperature reads back as two bytes, MSB first, holding a 12-bit two's complement value at 0.0625 °C per bit [[ti-tmp102]].</p>` },
          { ex: 'tmp102' },
          { ex: 'i2c-regs' },
        ],
      },
      {
        title: 'Pull-up resistors',
        blocks: [
          { html: `<p>The pull-ups set how fast lines rise, so they set the maximum speed. Their value is a trade-off [[ti-slva689]]:</p>
<ul><li><b>Too small</b> (strong pull-up): a device can't pull the line low enough. The minimum is <code>Rp(min) = (VDD − VOL(max)) / IOL</code>. With VOL(max) = 0.4 V at IOL = 3 mA in standard/fast mode and VDD = 3.3 V, that gives (3.3 − 0.4) / 0.003 ≈ 967 Ω.</li>
<li><b>Too large</b> (weak pull-up): the RC rise time exceeds the specification. The maximum is <code>Rp(max) = tr / (0.8473 × Cb)</code>, where tr is the allowed rise time (1000 ns for standard mode, 300 ns for fast mode) and Cb is the bus capacitance [[nxp-um10204]].</li></ul>
<p>Typical boards use 2.2 kΩ to 10 kΩ. If you see rounded, "shark fin" edges on a scope, the pull-ups are too weak for the speed.</p>` },
          { q: { type: 'num', prompt: 'Fast-mode bus (tr = 300 ns) with 100 pF of bus capacitance. What is the maximum pull-up value in ohms? Round to the nearest 10 Ω.', answer: 3541, tol: 15, unit: 'Ω', explain: '300 ns / (0.8473 × 100 pF) = 3,541 Ω. A standard 3.3 kΩ resistor works.' } },
        ],
      },
      {
        title: 'Real-world quirks',
        blocks: [
          { html: `<ul><li><b>Address conflicts.</b> Only ~112 addresses exist (16 are reserved), and many parts have just one or two possible addresses. Two identical sensors may need an address-select pin, a second bus, or an I²C multiplexer.</li>
<li><b>Clock stretching.</b> A slow target holds SCL low until it's ready. Some MCU I²C peripherals and bit-banged drivers handle this badly.</li>
<li><b>Bus lock-up.</b> If the MCU resets in the middle of a read, a target may still be holding SDA low, waiting for clocks. The specification's recovery: toggle SCL up to 9 times until the target releases SDA, then send STOP [[nxp-um10204]].</li>
<li><b>EEPROM write cycles.</b> Writes to an EEPROM aren't instant. The 24LC256 needs up to 5 ms per page write, ignores its address meanwhile, and wraps writes that cross a 64-byte page boundary [[mchp-24lc256]].</li>
<li><b>SMBus</b> is a stricter subset used in PCs and batteries. It adds timeouts and optional CRC-8 packet error checking [[smbus-3.2]].</li></ul>` },
          { q: { type: 'mcq', prompt: 'After a watchdog reset, every I²C transaction fails because SDA reads low. What is the standard recovery?', options: ['Power-cycle the whole product', 'Clock SCL up to 9 times until the target releases SDA, then generate a STOP', 'Increase the pull-up resistance', 'Switch to 10-bit addressing'], answer: 1, explain: 'The target is stuck mid-byte, waiting for clocks. Feeding it clocks lets it finish, after which a STOP resets the bus state.' } },
        ],
      },
    ],
    quiz: [
      { type: 'mcq', prompt: 'What makes a START condition different from a data bit?', options: ['It is longer', 'SDA changes while SCL is high, which data bits are never allowed to do', 'It is sent at a lower voltage', 'It uses the R/W bit'], answer: 1, explain: 'Normal data only changes while SCL is low. SDA falling with SCL high is START; SDA rising with SCL high is STOP.' },
      { type: 'mcq', prompt: 'Why are I²C lines open-drain with pull-ups instead of push-pull?', options: ['To save power', 'So multiple devices can drive the same wire safely, enabling ACKs, clock stretching and arbitration', 'Because I²C runs faster that way', 'To allow longer cables'], answer: 1, explain: 'Wired-AND lets any device pull low without fighting another device driving high.' },
      { type: 'text', prompt: 'Write the 3-byte wire sequence (hex, space separated) to write value 0x08 to register 0x2D of a device at 7-bit address 0x53.', answer: ['0xA6 0x2D 0x08', 'A6 2D 08', '0xa6 0x2d 0x08', 'a6 2d 08'], explain: 'Address byte (0x53 << 1) | 0 = 0xA6, then the register 0x2D, then the value 0x08.' },
      { type: 'multi', prompt: 'Which of these mean the controller should send STOP and report an error? Select all that apply.', options: ['NACK after the address byte', 'NACK after a register byte being written', 'ACK after the address byte', 'The target stretches the clock for 50 µs'], answer: [0, 1], explain: 'A NACK during a write means the target refused or is absent. Clock stretching is normal, though a very long stretch might trip a timeout.' },
      { type: 'num', prompt: 'TMP102 returns bytes 0x32 0x80. What temperature is that, in °C?', answer: 50.5, tol: 0.001, unit: '°C', explain: '0x3280 >> 4 = 0x328 = 808. 808 × 0.0625 = 50.5 °C.' },
      { type: 'mcq', prompt: 'You write 20 bytes to a 24LC256 starting at address 0x003C. What happens without page splitting?', options: ['All 20 bytes land at 0x003C to 0x004F', 'The first 4 bytes land at 0x003C to 0x003F, then the address wraps to 0x0000 and overwrites the start of the page', 'The EEPROM NACKs the whole write', 'The EEPROM splits it automatically'], answer: 1, explain: 'A page write wraps within its 64-byte page. Firmware must split writes at page boundaries.' },
    ],
    challenge: 'eeprom',
    challengeIntro: 'Handle two datasheet details that cause real field bugs: page wraparound and the write-cycle busy time [[mchp-24lc256]].',
    sources: ['nxp-um10204', 'ti-slva704', 'ti-tmp102', 'ti-slva689', 'mchp-24lc256', 'smbus-3.2', 'nxp-an10216', 'sparkfun-i2c', 'wiki-i2c'],
  });

  /* ======================= LESSON 6: CAN ======================= */
  L.push({
    id: 'can',
    title: 'CAN: the network inside every car',
    tagline: 'Differential bus, frames, priority arbitration, bit stuffing, error confinement and signal decoding.',
    minutes: 60,
    scenario: `A modern car has dozens of ECUs (electronic control units): engine, brakes, airbags, doors, dashboard. They share data like wheel speed and engine rpm hundreds of times per second, in an electrically brutal environment, and safety depends on it. Bosch developed the Controller Area Network for exactly this, and today it also runs tractors, elevators, medical devices and factory robots.`,
    sections: [
      {
        title: 'The physical bus',
        blocks: [
          { html: `<p>CAN nodes connect to a twisted pair, <b>CAN_H</b> and <b>CAN_L</b>, through a transceiver chip [[ti-sloa101]]. The bus has two states:</p>
<ul><li><b>Recessive (logic 1)</b>: nobody drives. Both wires sit at about 2.5 V, so the difference is roughly 0 V.</li>
<li><b>Dominant (logic 0)</b>: a transceiver drives CAN_H up to about 3.5 V and CAN_L down to about 1.5 V, a difference of roughly 2 V.</li></ul>
<p>If any node sends dominant, the bus is dominant. That is the same wired-AND idea as I²C, achieved with a differential pair. The bus is a single line, terminated with a <b>120 Ω resistor at each end</b> to stop reflections, so a healthy bus measures about 60 Ω between CAN_H and CAN_L with the power off [[ti-slla270]].</p>
<p>Classical CAN runs at up to 1 Mbit/s (cable length of roughly 40 m at that speed). Common rates are 125, 250 and 500 kbit/s. <b>CAN FD</b> (flexible data-rate) speeds up the data phase and carries up to 64 data bytes per frame [[cia-can]].</p>` },
          { q: { type: 'num', prompt: 'With the power off, you measure the resistance between CAN_H and CAN_L on a correctly terminated bus. What do you expect, in ohms?', answer: 60, tol: 3, unit: 'Ω', explain: 'Two 120 Ω terminators in parallel = 60 Ω. Reading 120 Ω means one terminator is missing.' } },
        ],
      },
      {
        title: 'The data frame',
        blocks: [
          { html: `<p>CAN has no node addresses. Each frame carries a <b>message identifier</b> that says what the data <i>is</i> ("engine speed"), and every node decides whether it cares. A classical base-format data frame contains [[ti-sloa101]][[kvaser-can]]:</p>
<div class="tblwrap"><table class="tbl canframe"><tr><th>SOF</th><th>Identifier</th><th>RTR</th><th>IDE</th><th>r0</th><th>DLC</th><th>Data</th><th>CRC</th><th>ACK</th><th>EOF</th></tr>
<tr><td>1</td><td>11</td><td>1</td><td>1</td><td>1</td><td>4</td><td>0–64</td><td>15 + 1</td><td>2</td><td>7</td></tr></table></div>
<ul><li><b>SOF</b>: a single dominant start bit.</li>
<li><b>Identifier</b>: 11 bits in the base format, or 29 bits in the extended format (IDE = 1), which J1939 trucks and buses use.</li>
<li><b>DLC</b>: data length code, 0 to 8 bytes.</li>
<li><b>CRC</b>: a 15-bit CRC plus a delimiter bit.</li>
<li><b>ACK slot</b>: the transmitter sends recessive, and <i>every</i> node that received the frame correctly overwrites it with dominant. So the sender knows at least one node got it, though not which one.</li></ul>
<p>Which message IDs exist and how the 8 bytes are laid out is defined by a higher layer: a vendor's DBC file, or standards like SAE J1939, CANopen and OBD-II [[css-can]][[css-dbc]].</p>` },
        ],
      },
      {
        title: 'Arbitration: priority without collisions',
        blocks: [
          { html: `<p>Any node may transmit when the bus is idle. If two start together, they resolve it during the identifier, bit by bit, without losing any time [[kvaser-can]]:</p>
<ol><li>Every transmitter sends its ID MSB first and reads back the bus.</li>
<li>A node that sends recessive (1) but reads dominant (0) knows a higher-priority frame is on the bus. It stops transmitting immediately and becomes a receiver.</li>
<li>The node with the <b>lowest ID</b> never sees a mismatch. Its frame goes through intact, which is why this is called <i>non-destructive</i> arbitration.</li></ol>
<p>So the ID is also the <b>priority</b>: 0x000 beats everything. System designers give brake and powertrain messages low IDs and comfort features high ones. Losers retry automatically as soon as the bus is free.</p>` },
          { widget: 'can' },
          { ex: 'can-filter' },
        ],
      },
      {
        title: 'Bit stuffing and bit timing',
        blocks: [
          { html: `<p>CAN is asynchronous: there is no clock wire, so every node re-synchronises on recessive-to-dominant edges. Long runs of identical bits would starve them of edges. The rule: after <b>5 consecutive identical bits</b>, the transmitter inserts one opposite bit, and receivers remove it. This applies from SOF through the CRC [[ti-sloa101]][[wiki-bitstuff]]. Six identical bits in a row on the bus is therefore illegal, and it is used deliberately as an error signal.</p>
<p>Each bit time is divided into <b>time quanta</b> (tq) derived from the controller clock: a sync segment (1 tq), propagation and phase segment 1, then the <b>sample point</b>, then phase segment 2. For automotive networks the sample point is typically placed around 87.5% of the bit [[cia-can]]. Example: at 500 kbit/s with an 8 MHz CAN clock and a prescaler of 1, one bit is 16 tq. Sampling after tq 14 puts the sample point at 14/16 = 87.5%.</p>` },
          { ex: 'bitstuff' },
        ],
      },
      {
        title: 'Errors and fault confinement',
        blocks: [
          { html: `<p>Every node checks every frame, using five mechanisms [[ti-sloa101]][[kvaser-can]]:</p>
<ul><li><b>Bit error</b>: a transmitter reads back a different level than it sent (outside arbitration and the ACK slot).</li>
<li><b>Stuff error</b>: six identical bits in a row.</li>
<li><b>CRC error</b>: the computed CRC doesn't match.</li>
<li><b>Form error</b>: a fixed-format bit (such as a delimiter or EOF) has the wrong value.</li>
<li><b>ACK error</b>: nobody acknowledged the frame.</li></ul>
<p>A node that detects an error transmits an <b>error frame</b> (six dominant bits, which breaks stuffing on purpose). Everyone discards the frame, and the sender retransmits automatically.</p>
<p>To stop one faulty node from jamming the network, each node keeps a transmit error counter (TEC) and a receive error counter (REC). Errors increase them and successful frames decrease them. A node is <b>error-active</b> while both counters are below 128, <b>error-passive</b> from 128 (it may only send passive, recessive error flags), and <b>bus-off</b> when TEC exceeds 255. A bus-off node takes no part in bus traffic until it recovers [[kvaser-can]].</p>` },
          { q: { type: 'mcq', prompt: 'One ECU has a broken transceiver and keeps corrupting its own frames. What does CAN do about it?', options: ['Nothing; the other nodes keep receiving garbage', 'Its transmit error counter climbs until it goes error-passive, then bus-off, removing it from the bus', 'The lowest-ID node resets it', 'The bus slows to 125 kbit/s'], answer: 1, explain: 'Fault confinement isolates a misbehaving node automatically, so the rest of the network keeps working.' } },
        ],
      },
      {
        title: 'From frames to signals',
        blocks: [
          { html: `<p>Application code rarely cares about bytes. It cares about <b>signals</b> like engine speed, gear or door state, packed into the 8 data bytes. A DBC file describes each signal by start bit, length, byte order, scale factor, offset and unit [[css-dbc]]:</p>
<pre class="code">SG_ EngineSpeed : 24|16@1+ (0.125,0) [0|8031.875] "rpm"</pre>
<p>Read this as: start bit 24, 16 bits long, <code>@1</code> = Intel (little-endian), <code>+</code> = unsigned, factor 0.125, offset 0. That is the engine speed signal of SAE J1939's EEC1 message.</p>
<p>Safety-relevant messages often add end-to-end protection: a <b>rolling counter</b> to catch lost or repeated frames, and a <b>checksum</b> or CRC to catch corruption that CAN's own CRC can't see, like a bug in the sending ECU's software. The AUTOSAR E2E profiles standardise this pattern.</p>` },
          { ex: 'can-signal' },
        ],
      },
    ],
    quiz: [
      { type: 'mcq', prompt: 'Nodes transmitting IDs 0x2A0, 0x1F4 and 0x2A1 start at the same moment. Which frame gets through?', options: ['0x2A0', '0x1F4', '0x2A1', 'All three collide and retry'], answer: 1, explain: 'The lowest ID wins: 0x1F4 has a 0 at bit 9 where the others have 1, so they drop out there.' },
      { type: 'mcq', prompt: 'What does a dominant bit in the ACK slot tell the transmitter?', options: ['That the intended recipient processed the message', 'That at least one node received the frame without errors', 'That all nodes received it', 'That the bus is idle'], answer: 1, explain: 'Any correct receiver acknowledges. CAN has no idea who the "intended recipient" is.' },
      { type: 'num', prompt: 'What is the longest run of identical bits allowed between SOF and the end of the CRC on a valid CAN bus?', answer: 5, tol: 0, unit: 'bits', explain: 'After 5 identical bits a stuff bit is inserted, so 6 in a row is a stuff error.' },
      { type: 'multi', prompt: 'Which of these are CAN error types? Select all that apply.', options: ['Bit error', 'Stuff error', 'NACK error', 'CRC error', 'Form error'], answer: [0, 1, 3, 4], explain: 'The fifth type is ACK error (nobody acknowledged). "NACK" is I²C terminology.' },

(function (root) {
