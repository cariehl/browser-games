<script>
/* MiniC: a small C interpreter for teaching embedded C in the browser.
 * ILP32 model (int/long/pointers are 32-bit, like ARM Cortex-M), little-endian,
 * byte-addressed RAM, memory-mapped peripheral hooks at 0x40000000 and above. */
(function (root) {
  'use strict';

  class CError extends Error {
    constructor(kind, msg, line) {
      super(msg);
      this.kind = kind; // 'compile' | 'runtime' | 'timeout'
      this.line = line || 0;
    }
  }

  // ---------------- Types ----------------
  const T = {};
  function intT(name, size, signed) { return { k: 'int', name, size, align: size, signed }; }
  T.char = intT('char', 1, true);
  T.schar = intT('signed char', 1, true);
  T.uchar = intT('unsigned char', 1, false);
  T.short = intT('short', 2, true);
  T.ushort = intT('unsigned short', 2, false);
  T.int = intT('int', 4, true);
  T.uint = intT('unsigned int', 4, false);
  T.long = intT('long', 4, true);
  T.ulong = intT('unsigned long', 4, false);
  T.bool = { k: 'int', name: 'bool', size: 1, align: 1, signed: false, isBool: true };
  T.float = { k: 'float', name: 'float', size: 4, align: 4 };
  T.double = { k: 'float', name: 'double', size: 8, align: 8 };
  T.void = { k: 'void', name: 'void', size: 1, align: 1 };
  const ptr = (to) => ({ k: 'ptr', to, size: 4, align: 4 });
  const arr = (of, n) => ({ k: 'arr', of, n, size: n == null ? 0 : of.size * n, align: of.align });
  const fnT = (ret, params, variadic) => ({ k: 'func', ret, params, variadic, size: 1, align: 1 });

  const BUILTIN_TYPEDEFS = {
    uint8_t: T.uchar, int8_t: T.schar, uint16_t: T.ushort, int16_t: T.short,
    uint32_t: T.uint, int32_t: T.int, size_t: T.uint, uintptr_t: T.uint, intptr_t: T.int,
    bool: T.bool, _Bool: T.bool, ptrdiff_t: T.int,
    uint_fast8_t: T.uint, uint_least8_t: T.uchar, int_fast8_t: T.int,
  };

  function typeName(t) {
    if (!t) return '?';
    switch (t.k) {
      case 'int': case 'float': case 'void': return t.name;
      case 'ptr': return t.to.k === 'func' ? 'function pointer' : typeName(t.to) + '*';
      case 'arr': return typeName(t.of) + '[' + (t.n == null ? '' : t.n) + ']';
      case 'struct': return (t.union ? 'union ' : 'struct ') + (t.tag || '<anon>');
      case 'func': return 'function';
    }
    return t.k;
  }
  const isInt = (t) => t.k === 'int';
  const isArith = (t) => t.k === 'int' || t.k === 'float';
  const isPtrLike = (t) => t.k === 'ptr' || t.k === 'arr';
  const isScalar = (t) => isArith(t) || t.k === 'ptr';

  function convert(v, t) {
    switch (t.k) {
      case 'int':
        if (t.isBool) return v ? 1 : 0;
        if (typeof v !== 'number' || !isFinite(v)) v = 0;
        v = Math.trunc(v);
        if (Math.abs(v) > 0xFFFFFFFF) v = v % 4294967296;
        if (t.size === 4) return t.signed ? v | 0 : v >>> 0;
        if (t.size === 2) return t.signed ? (v << 16) >> 16 : v & 0xFFFF;
        return t.signed ? (v << 24) >> 24 : v & 0xFF;
      case 'float': return t.size === 4 ? Math.fround(v) : +v;
      case 'ptr': return v >>> 0;
      default: return v;
    }
  }

  // ---------------- Lexer ----------------
  const KEYWORDS = new Set(('auto break case char const continue default do double else enum extern float for goto if inline int long register restrict return short signed sizeof static struct switch typedef union unsigned void volatile while _Bool').split(' '));
  const PUNCT = ['>>=', '<<=', '...', '->', '++', '--', '<<', '>>', '<=', '>=', '==', '!=', '&&', '||', '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '##',
    '+', '-', '*', '/', '%', '&', '|', '^', '~', '!', '<', '>', '=', '?', ':', ';', ',', '.', '(', ')', '[', ']', '{', '}', '#'];

  function lex(src, lineOffset) {
    const toks = [];
    let i = 0, line = 1 + (lineOffset || 0);
    const n = src.length;
    let bol = true; // beginning of line (for # directives)
    let ws = false;
    const push = toks.push.bind(toks);
    toks.push = (t) => { t.ws = ws; ws = false; return push(t); };
    while (i < n) {
      const c = src[i];
      if (c === '\n') { line++; i++; bol = true; toks.push({ t: 'nl', line: line - 1 }); continue; }
      if (c === ' ' || c === '\t' || c === '\r' || c === '\f' || c === '\v') { i++; ws = true; continue; }
      if (c === '\\' && src[i + 1] === '\n') { i += 2; line++; continue; }
      if (c === '\\' && src[i + 1] === '\r' && src[i + 2] === '\n') { i += 3; line++; continue; }
      if (c === '/' && src[i + 1] === '/') { while (i < n && src[i] !== '\n') i++; continue; }
      if (c === '/' && src[i + 1] === '*') {
        const start = line;
        i += 2;
        while (i < n && !(src[i] === '*' && src[i + 1] === '/')) { if (src[i] === '\n') line++; i++; }
        if (i >= n) throw new CError('compile', 'Unterminated /* comment */', start);
        i += 2; ws = true; continue;
      }
      const startLine = line;
      if (/[A-Za-z_]/.test(c)) {
        let j = i + 1;
        while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
        const w = src.slice(i, j);
        toks.push({ t: KEYWORDS.has(w) ? 'kw' : 'id', v: w, line: startLine, bol });
        i = j; bol = false; continue;
      }
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1]))) {
        let j = i;
        let isFloat = false, val;
        if (c === '0' && (src[i + 1] === 'x' || src[i + 1] === 'X')) {
          j = i + 2; while (j < n && /[0-9a-fA-F]/.test(src[j])) j++;
          if (j === i + 2) throw new CError('compile', 'Invalid hex literal', line);
          val = parseInt(src.slice(i + 2, j), 16);
        } else if (c === '0' && (src[i + 1] === 'b' || src[i + 1] === 'B')) {
          j = i + 2; while (j < n && /[01]/.test(src[j])) j++;
          val = parseInt(src.slice(i + 2, j), 2);
        } else {
          while (j < n && /[0-9]/.test(src[j])) j++;
          if (src[j] === '.') { isFloat = true; j++; while (j < n && /[0-9]/.test(src[j])) j++; }
          if (src[j] === 'e' || src[j] === 'E') {
            isFloat = true; j++; if (src[j] === '+' || src[j] === '-') j++;
            while (j < n && /[0-9]/.test(src[j])) j++;
          }
          const s = src.slice(i, j);
          val = isFloat ? parseFloat(s) : (s.length > 1 && s[0] === '0' ? parseInt(s, 8) : parseInt(s, 10));
        }
        let uns = false, lng = 0, flt = false;
        while (j < n && /[uUlLfF]/.test(src[j])) {
          const ch = src[j].toLowerCase();
          if (ch === 'u') uns = true; else if (ch === 'l') lng++; else if (ch === 'f') flt = true;
          j++;
        }
        if (/[A-Za-z0-9_]/.test(src[j] || '')) throw new CError('compile', 'Invalid number literal "' + src.slice(i, j + 1) + '"', line);
        if (lng >= 2) throw new CError('compile', '64-bit (long long) literals are not supported in this sandbox', line);
        let type;
        if (isFloat || flt && isFloat) type = flt ? T.float : T.double;
        else if (uns) type = T.uint;
        else if (val > 0x7FFFFFFF) type = T.uint; // hex literals that don't fit int become unsigned
        else type = T.int;
        if (!isFloat && val > 0xFFFFFFFF) throw new CError('compile', 'Integer literal too large for 32 bits', line);
        toks.push({ t: 'num', v: val, type, line: startLine, bol });
        i = j; bol = false; continue;
      }
      if (c === "'") {
        let j = i + 1; const r = readChar(src, j, line); j = r.next;
        if (src[j] !== "'") throw new CError('compile', 'Unterminated character literal', line);
        toks.push({ t: 'num', v: r.code, type: T.int, line: startLine, bol, chr: true });
        i = j + 1; bol = false; continue;
      }
      if (c === '"') {
        let j = i + 1; let s = [];
        while (j < n && src[j] !== '"') {
          if (src[j] === '\n') throw new CError('compile', 'Unterminated string literal', line);
          const r = readChar(src, j, line); s.push(r.code); j = r.next;
        }
        if (j >= n) throw new CError('compile', 'Unterminated string literal', line);
        toks.push({ t: 'str', v: s, line: startLine, bol });
        i = j + 1; bol = false; continue;
      }
      let p = null;
      for (const q of PUNCT) { if (src.startsWith(q, i)) { p = q; break; } }
      if (!p) throw new CError('compile', 'Unexpected character "' + c + '"', line);
      toks.push({ t: 'p', v: p, line: startLine, bol });
      i += p.length; bol = false;
    }
    toks.push({ t: 'nl', line });
    return toks;
  }
  function readChar(src, j, line) {
    if (src[j] !== '\\') return { code: src.charCodeAt(j) & 0xFF, next: j + 1 };
    const e = src[j + 1];
    const simple = { n: 10, t: 9, r: 13, '0': 0, '\\': 92, "'": 39, '"': 34, a: 7, b: 8, f: 12, v: 11, '?': 63 };
    if (e === 'x') {
      let k = j + 2; while (/[0-9a-fA-F]/.test(src[k] || '')) k++;
      return { code: parseInt(src.slice(j + 2, k), 16) & 0xFF, next: k };
    }
    if (/[0-7]/.test(e)) {
      let k = j + 1; while (k < j + 4 && /[0-7]/.test(src[k] || '')) k++;
      return { code: parseInt(src.slice(j + 1, k), 8) & 0xFF, next: k };
    }
    if (e in simple) return { code: simple[e], next: j + 2 };
    throw new CError('compile', 'Unknown escape sequence \\' + e, line);
  }

  // ---------------- Preprocessor ----------------
  // Course-provided headers, available with #include "name.h"
  const HEADER_LINE_BASE = 900000;
  const HEADERS = {
    'bits.h': `/* bits.h: bit-manipulation helpers from Lesson 1.4 */
#ifndef BITS_H
#define BITS_H
#include <stdint.h>
#include <stdbool.h>

static inline uint32_t set_bit(uint32_t reg, uint8_t n)    { return reg | (1u << n); }
static inline uint32_t clear_bit(uint32_t reg, uint8_t n)  { return reg & ~(1u << n); }
static inline uint32_t toggle_bit(uint32_t reg, uint8_t n) { return reg ^ (1u << n); }
static inline bool     test_bit(uint32_t reg, uint8_t n)   { return (reg >> n) & 1u; }

static inline uint32_t read_field(uint32_t reg, uint8_t pos, uint8_t width) {
    return (reg >> pos) & ((1u << width) - 1u);
}

static inline uint32_t write_field(uint32_t reg, uint8_t pos, uint8_t width, uint32_t value) {
    uint32_t mask = ((1u << width) - 1u) << pos;
    return (reg & ~mask) | ((value << pos) & mask);
}

#endif
`,
    'endian.h': `/* endian.h: portable byte-order helpers from Lesson 1.7 */
#ifndef ENDIAN_H
#define ENDIAN_H
#include <stdint.h>

static inline uint16_t get_u16_le(const uint8_t *p) { return (uint16_t)(p[0] | (p[1] << 8)); }
static inline uint16_t get_u16_be(const uint8_t *p) { return (uint16_t)((p[0] << 8) | p[1]); }

static inline uint32_t get_u32_le(const uint8_t *p) {
    return (uint32_t)p[0] | ((uint32_t)p[1] << 8) | ((uint32_t)p[2] << 16) | ((uint32_t)p[3] << 24);
}
static inline uint32_t get_u32_be(const uint8_t *p) {
    return ((uint32_t)p[0] << 24) | ((uint32_t)p[1] << 16) | ((uint32_t)p[2] << 8) | (uint32_t)p[3];
}

static inline void put_u16_le(uint8_t *p, uint16_t v) { p[0] = (uint8_t)v; p[1] = (uint8_t)(v >> 8); }
static inline void put_u16_be(uint8_t *p, uint16_t v) { p[0] = (uint8_t)(v >> 8); p[1] = (uint8_t)v; }

static inline void put_u32_le(uint8_t *p, uint32_t v) {
    p[0] = (uint8_t)v; p[1] = (uint8_t)(v >> 8); p[2] = (uint8_t)(v >> 16); p[3] = (uint8_t)(v >> 24);
}
static inline void put_u32_be(uint8_t *p, uint32_t v) {
    p[0] = (uint8_t)(v >> 24); p[1] = (uint8_t)(v >> 16); p[2] = (uint8_t)(v >> 8); p[3] = (uint8_t)v;
}

#endif
`,
  };

  function preprocess(toks, predefined) {
    const macros = new Map(Object.entries(predefined || {}));
    const out = [];
    // split into lines
    const lines = [];
    let cur = [];
    for (const t of toks) { if (t.t === 'nl') { lines.push(cur); cur = []; } else cur.push(t); }
    if (cur.length) lines.push(cur);
    const condStack = []; // {active, taken}
    const active = () => condStack.every((c) => c.active);
    const included = new Set();
    for (let li = 0; li < lines.length; li++) {
      const ln = lines[li];
      if (!ln.length) continue;
      if (ln[0].t === 'p' && ln[0].v === '#') {
        const d = ln[1];
        const dname = d ? d.v : '';
        const line = ln[0].line;
        if (dname === 'ifdef' || dname === 'ifndef') {
          const def = ln[2] && macros.has(ln[2].v);
          const a = dname === 'ifdef' ? def : !def;
          condStack.push({ active: a, taken: a });
        } else if (dname === 'if') {
          let a = false;
          if (active()) {
            const expr = expandMacros(ln.slice(2).map((t) => (t.t === 'id' && t.v === 'defined') ? t : t), macros, line);
            // handle defined(X)
            const fixed = [];
            for (let k = 0; k < expr.length; k++) {
              const t = expr[k];
              if (t.t === 'id' && t.v === 'defined') {
                let nm;
                if (expr[k + 1] && expr[k + 1].v === '(') { nm = expr[k + 2].v; k += 3; } else { nm = expr[k + 1].v; k += 1; }
                fixed.push({ t: 'num', v: macros.has(nm) ? 1 : 0, type: T.int, line });
              } else if (t.t === 'id') fixed.push({ t: 'num', v: 0, type: T.int, line });
              else fixed.push(t);
            }
            const p = new Parser(fixed.concat([{ t: 'eof', line }]));
            const e = p.parseExpr();
            a = !!p.constEval(e);
          }
          condStack.push({ active: a, taken: a });
        } else if (dname === 'elif') {
          const top = condStack[condStack.length - 1];
          if (!top) throw new CError('compile', '#elif without #if', line);
          if (top.taken) top.active = false;
          else {
            const p = new Parser(expandMacros(ln.slice(2), macros, line).map((t) => t.t === 'id' ? { t: 'num', v: 0, type: T.int, line } : t).concat([{ t: 'eof', line }]));
            top.active = !!p.constEval(p.parseExpr()); top.taken = top.active;
          }
        } else if (dname === 'else') {
          const top = condStack[condStack.length - 1];
          if (!top) throw new CError('compile', '#else without #if', line);
          top.active = !top.taken; top.taken = true;
        } else if (dname === 'endif') {
          if (!condStack.pop()) throw new CError('compile', '#endif without #if', line);
        } else if (!active()) {
          continue;
        } else if (dname === 'define') {
          const nm = ln[2];
          if (!nm || nm.t !== 'id' && nm.t !== 'kw') throw new CError('compile', '#define needs a name', line);
          // function-like if '(' immediately follows with no space: we approximate: '(' token directly after name on same line
          const rest = ln.slice(3);
          if (rest.length && rest[0].v === '(' && rest[0].t === 'p' && isAdjacent(nm, rest[0])) {
            const params = []; let k = 1;
            while (k < rest.length && rest[k].v !== ')') { if (rest[k].v !== ',') params.push(rest[k].v); k++; }
            macros.set(nm.v, { params, body: rest.slice(k + 1) });
          } else macros.set(nm.v, { body: rest });
        } else if (dname === 'undef') {
          macros.delete(ln[2] && ln[2].v);
        } else if (dname === 'include' && ln[2] && ln[2].t === 'str') {
          const name = String.fromCharCode(...ln[2].v);
          const src = HEADERS[name];
          if (src === undefined) throw new CError('compile', 'Unknown header "' + name + '". Headers available in this sandbox: ' + Object.keys(HEADERS).map((k) => '"' + k + '"').join(', ') + ', plus the standard <stdint.h>, <stdbool.h>, <stdio.h> and <string.h>.', line);
          if (included.has(name)) continue;
          included.add(name);
          const hl = []; let cur2 = [];
          for (const t of lex(src, HEADER_LINE_BASE)) { if (t.t === 'nl') { hl.push(cur2); cur2 = []; } else cur2.push(t); }
          if (cur2.length) hl.push(cur2);
          lines.splice(li + 1, 0, ...hl);
        } else if (dname === 'include' || dname === 'pragma' || dname === 'error' || dname === 'warning' || dname === undefined) {
          if (dname === 'error') throw new CError('compile', '#error ' + ln.slice(2).map((t) => t.v).join(' '), line);
          // includes are satisfied by built-ins
        } else {
          throw new CError('compile', 'Unsupported preprocessor directive #' + dname, line);
        }
        continue;
      }
      if (!active()) continue;
      for (const t of expandMacros(ln, macros, ln[0].line)) out.push(t);
    }
    if (condStack.length) throw new CError('compile', 'Missing #endif', 0);
    out.push({ t: 'eof', line: toks.length ? toks[toks.length - 1].line : 1 });
    return out;
  }
  // lexer doesn't record columns; treat '(' after macro name as function-like unless separated: record via raw positions is overkill.
  function isAdjacent(a, b) { return !b.ws; }

  function expandMacros(toks, macros, line, hide) {
    hide = hide || new Set();
    const out = [];
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t.t === 'id' && macros.has(t.v) && !hide.has(t.v)) {
        const m = macros.get(t.v);
        if (m.params) {
          if (!toks[i + 1] || toks[i + 1].v !== '(') { out.push(t); continue; }
          // collect args
          let depth = 0, k = i + 1; const args = []; let curA = [];
          for (; k < toks.length; k++) {
            const x = toks[k];
            if (x.v === '(' && x.t === 'p') { if (depth++ === 0) continue; }
            else if (x.v === ')' && x.t === 'p') { if (--depth === 0) break; }
            else if (x.v === ',' && x.t === 'p' && depth === 1) { args.push(curA); curA = []; continue; }
            curA.push(x);
          }
          if (k >= toks.length) throw new CError('compile', 'Unterminated call to macro ' + t.v, t.line);
          if (curA.length || args.length) args.push(curA);
          if (args.length !== m.params.length && !(m.params.length === 0 && args.length === 0))
            throw new CError('compile', 'Macro ' + t.v + ' expects ' + m.params.length + ' argument(s), got ' + args.length, t.line);
          const expArgs = args.map((a) => expandMacros(a, macros, line, hide));
          const body = [];
          for (let b = 0; b < m.body.length; b++) {
            const bt = m.body[b];
            if (bt.t === 'p' && bt.v === '#' && m.body[b + 1]) {
              const pi = m.params.indexOf(m.body[b + 1].v);
              if (pi >= 0) {
                const s = args[pi].map((x) => x.t === 'str' ? '"' + String.fromCharCode(...x.v) + '"' : String(x.v)).join(' ');
                body.push({ t: 'str', v: Array.from(s).map((ch) => ch.charCodeAt(0)), line: t.line }); b++; continue;
              }
            }
            const pi = bt.t === 'id' ? m.params.indexOf(bt.v) : -1;
            if (pi >= 0) for (const a of expArgs[pi]) body.push(Object.assign({}, a, { line: t.line }));
            else body.push(Object.assign({}, bt, { line: t.line }));
          }
          const h2 = new Set(hide); h2.add(t.v);
          for (const x of expandMacros(body, macros, line, h2)) out.push(x);
          i = k;
        } else {
          const h2 = new Set(hide); h2.add(t.v);
          for (const x of expandMacros(m.body.map((bt) => Object.assign({}, bt, { line: t.line })), macros, line, h2)) out.push(x);
        }
      } else out.push(t);
    }
    return out;
  }

  // ---------------- Parser ----------------
  const BINPREC = {
    '||': 1, '&&': 2, '|': 3, '^': 4, '&': 5, '==': 6, '!=': 6, '<': 7, '>': 7, '<=': 7, '>=': 7,
    '<<': 8, '>>': 8, '+': 9, '-': 9, '*': 10, '/': 10, '%': 10,
  };
  const ASSIGN_OPS = new Set(['=', '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '<<=', '>>=']);

  class Parser {
    constructor(toks) {
      this.toks = toks; this.i = 0;
      this.scopes = [new Map()]; // name -> {typedef:type} or {enumConst:value} or {var:true}
      this.tags = [new Map()];
      for (const k in BUILTIN_TYPEDEFS) this.scopes[0].set(k, { typedef: BUILTIN_TYPEDEFS[k] });
      this.scopes[0].set('true', { enumConst: 1 });
      this.scopes[0].set('false', { enumConst: 0 });
    }
    peek(o) { return this.toks[this.i + (o || 0)]; }
    next() { return this.toks[this.i++]; }
    is(v, o) { const t = this.peek(o); return t && (t.t === 'p' || t.t === 'kw') && t.v === v; }
    accept(v) { if (this.is(v)) { this.i++; return true; } return false; }
    expect(v, what) {
      if (!this.is(v)) {
        const t = this.peek();
        throw new CError('compile', 'Expected "' + v + '"' + (what ? ' ' + what : '') + ' but found ' + desc(t), t.line);
      }
      return this.next();
    }
    line() { return this.peek().line; }
    lookup(name) { for (let s = this.scopes.length - 1; s >= 0; s--) if (this.scopes[s].has(name)) return this.scopes[s].get(name); return null; }
    lookupTag(name) { for (let s = this.tags.length - 1; s >= 0; s--) if (this.tags[s].has(name)) return this.tags[s].get(name); return null; }
    pushScope() { this.scopes.push(new Map()); this.tags.push(new Map()); }
    popScope() { this.scopes.pop(); this.tags.pop(); }
    isTypedefName(t) { if (!t || t.t !== 'id') return false; const e = this.lookup(t.v); return !!(e && e.typedef); }
    startsType(o) {
      const t = this.peek(o || 0);
      if (!t) return false;
      if (t.t === 'kw') return ['void', 'char', 'short', 'int', 'long', 'float', 'double', 'signed', 'unsigned', '_Bool', 'struct', 'union', 'enum', 'const', 'volatile', 'static', 'extern', 'typedef', 'register', 'inline', 'auto', 'restrict'].includes(t.v);
      return this.isTypedefName(t);
    }

    parseProgram() {
      const decls = [];
      while (this.peek().t !== 'eof') {
        if (this.accept(';')) continue;
        decls.push(...this.parseExternal());
      }
      return decls;
    }

    parseSpecifiers() {
      const line = this.line();
      let storage = null, sawType = false;
      let base = null; let signed = null, nShort = 0, nLong = 0, kind = null;
      let isConst = false, isVolatile = false;
      for (;;) {
        const t = this.peek();
        if (t.t === 'kw') {
          switch (t.v) {
            case 'typedef': case 'static': case 'extern': case 'register': case 'auto': storage = storage || t.v; if (t.v === 'typedef') storage = 'typedef'; this.i++; continue;
            case 'inline': case 'restrict': this.i++; continue;
            case 'const': isConst = true; this.i++; continue;
            case 'volatile': isVolatile = true; this.i++; continue;
            case 'signed': signed = true; sawType = true; this.i++; continue;
            case 'unsigned': signed = false; sawType = true; this.i++; continue;
            case 'short': nShort++; sawType = true; this.i++; continue;
            case 'long': nLong++; sawType = true; this.i++; continue;
            case 'int': kind = kind || 'int'; sawType = true; this.i++; continue;
            case 'char': kind = 'char'; sawType = true; this.i++; continue;
            case 'void': kind = 'void'; sawType = true; this.i++; continue;
            case 'float': kind = 'float'; sawType = true; this.i++; continue;
            case 'double': kind = 'double'; sawType = true; this.i++; continue;
            case '_Bool': base = T.bool; sawType = true; this.i++; continue;
            case 'struct': case 'union': base = this.parseStructSpec(); sawType = true; continue;
            case 'enum': base = this.parseEnumSpec(); sawType = true; continue;
          }
        }
        if (!sawType && this.isTypedefName(t)) { base = this.lookup(t.v).typedef; sawType = true; this.i++; continue; }
        break;
      }
      if (!sawType) return null;
      if (nLong >= 2) throw new CError('compile', '64-bit types (long long) are not supported in this sandbox. Use uint32_t.', line);
      if (!base) {
        if (kind === 'void') base = T.void;
        else if (kind === 'float') base = T.float;
        else if (kind === 'double') base = T.double;
        else if (kind === 'char') base = signed === false ? T.uchar : signed === true ? T.schar : T.char;
        else if (nShort) base = signed === false ? T.ushort : T.short;
        else if (nLong) base = signed === false ? T.ulong : T.long;
        else base = signed === false ? T.uint : T.int;
      }
      return { storage, base, isConst, isVolatile, line };
    }

    parseStructSpec() {
      const isUnion = this.next().v === 'union';
      let tag = null;
      if (this.peek().t === 'id') tag = this.next().v;
      if (this.is('{')) {
        let st = tag ? this.tags[this.tags.length - 1].get(tag) : null;
        if (!st || st.complete) { st = { k: 'struct', tag, union: isUnion, fields: [], size: 0, align: 1, complete: false }; if (tag) this.tags[this.tags.length - 1].set(tag, st); }
        this.next();
        let off = 0, maxAlign = 1, maxSize = 0;
        while (!this.accept('}')) {
          const spec = this.parseSpecifiers();
          if (!spec) throw new CError('compile', 'Expected a field type in ' + (isUnion ? 'union' : 'struct') + ' but found ' + desc(this.peek()), this.line());
          do {
            const d = this.parseDeclarator();
            let ft = d.wrap(spec.base);
            if (this.accept(':')) throw new CError('compile', 'Bit-fields are not supported in this sandbox; use masks and shifts instead', this.line());
            if (ft.k === 'struct' && !ft.complete) throw new CError('compile', 'Field "' + d.name + '" has incomplete type', this.line());
            const a = ft.align;
            if (isUnion) { st.fields.push({ name: d.name, type: ft, off: 0 }); maxSize = Math.max(maxSize, ft.size); }
            else { off = alignUp(off, a); st.fields.push({ name: d.name, type: ft, off }); off += ft.size; }
            maxAlign = Math.max(maxAlign, a);
          } while (this.accept(','));
          this.expect(';', 'after struct field');
        }
        st.align = maxAlign;
        st.size = alignUp(isUnion ? maxSize : off, maxAlign) || 0;
        st.complete = true;
        return st;
      }
      if (!tag) throw new CError('compile', 'Expected struct name or "{"', this.line());
      let st = this.lookupTag(tag);
      if (!st) { st = { k: 'struct', tag, union: isUnion, fields: [], size: 0, align: 1, complete: false }; this.tags[this.tags.length - 1].set(tag, st); }
      return st;
    }

    parseEnumSpec() {
      this.next();
      if (this.peek().t === 'id') this.next();
      if (this.accept('{')) {
        let val = 0;
        while (!this.accept('}')) {
          const nm = this.next();
          if (nm.t !== 'id') throw new CError('compile', 'Expected enum constant name', nm.line);
          if (this.accept('=')) val = this.constEval(this.parseAssign());
          this.scopes[this.scopes.length - 1].set(nm.v, { enumConst: val | 0 });
          val++;
          if (!this.accept(',')) { this.expect('}', 'to close enum'); break; }
        }
      }
      return T.int;
    }

    // returns {name, wrap(base)->type, params?}
    parseDeclarator(allowAbstract) {
      let ptrs = 0;
      while (this.accept('*')) { while (this.is('const') || this.is('volatile') || this.is('restrict')) this.i++; ptrs++; }
      let name = null, inner = null, line = this.line();
      if (this.is('(') && (this.is('*', 1) || this.is('(', 1) || (this.peek(1).t === 'id' && !this.isTypedefName(this.peek(1)) && !this.startsType(1)))) {
        this.next(); inner = this.parseDeclarator(allowAbstract); this.expect(')');
      } else if (this.peek().t === 'id') { name = this.next().v; }
      else if (!allowAbstract) throw new CError('compile', 'Expected a name but found ' + desc(this.peek()), this.line());
      const suffixes = [];
      let params = null;
      for (;;) {
        if (this.accept('[')) {
          if (this.accept(']')) { suffixes.push({ arr: null }); continue; }
          const n = this.constEval(this.parseExpr());
          this.expect(']');
          if (n <= 0) throw new CError('compile', 'Array size must be positive', this.line());
          suffixes.push({ arr: n });
        } else if (this.is('(')) {
          this.next();
          const ps = this.parseParams();
          if (!params) params = ps.list;
          suffixes.push({ fn: ps });
        } else break;
      }
      const res = {
        name: inner ? inner.name : name, line,
        params: inner ? inner.params : params,
        wrap: (base) => {
          let t = base;
          for (let k = 0; k < ptrs; k++) t = ptr(t);
          for (let k = suffixes.length - 1; k >= 0; k--) {
            const s = suffixes[k];
            if (s.fn) t = fnT(t, s.fn.list.map((p) => p.type), s.fn.variadic);
            else t = arr(t, s.arr);
          }
          return inner ? inner.wrap(t) : t;
        },
      };
      return res;
    }

    parseParams() {
      const list = []; let variadic = false;
      if (this.accept(')')) return { list, variadic };
      if (this.is('void') && this.is(')', 1)) { this.i += 2; return { list, variadic }; }
      for (;;) {
        if (this.accept('...')) { variadic = true; break; }
        const spec = this.parseSpecifiers();
        if (!spec) throw new CError('compile', 'Expected parameter type but found ' + desc(this.peek()), this.line());
        const d = this.parseDeclarator(true);
        let t = d.wrap(spec.base);
        if (t.k === 'arr') t = ptr(t.of);
        if (t.k === 'func') t = ptr(t);
        list.push({ name: d.name, type: t });
        if (!this.accept(',')) break;
      }
      this.expect(')', 'to close parameter list');
      return { list, variadic };
    }

    parseTypeName() {
      const spec = this.parseSpecifiers();
      if (!spec) throw new CError('compile', 'Expected a type', this.line());
      const d = this.parseDeclarator(true);
      return d.wrap(spec.base);
    }

    parseExternal() {
      const spec = this.parseSpecifiers();
      const line = this.line();
      if (!spec) {
        const t = this.peek();
        if (t.t === 'id' && this.is('(', 1)) throw new CError('compile', 'Function "' + t.v + '" needs a return type (e.g. "void ' + t.v + '(...)")', t.line);
        throw new CError('compile', 'Expected a declaration but found ' + desc(t) + (t.t === 'id' ? ' (unknown type name?)' : ''), t.line);
      }
      if (this.accept(';')) return [];
      const out = [];
      for (;;) {
        const d = this.parseDeclarator();
        const t = d.wrap(spec.base);
        if (spec.storage === 'typedef') {
          this.scopes[0].set(d.name, { typedef: t });
        } else if (t.k === 'func') {
          if (this.is('{')) {
            this.scopes[0].set(d.name, { fn: true });
            this.pushScope();
            for (const p of d.params || []) if (p.name) this.scopes[this.scopes.length - 1].set(p.name, { var: true });
            const body = this.parseBlock(true);
            this.popScope();
            out.push({ node: 'func', name: d.name, type: t, params: d.params || [], body, line: d.line });
            return out;
          }
          this.scopes[0].set(d.name, { fn: true });
          out.push({ node: 'proto', name: d.name, type: t, line: d.line });
        } else {
          this.scopes[0].set(d.name, { var: true });
          let init = null;
          if (this.accept('=')) init = this.parseInitializer();
          out.push({ node: 'gvar', name: d.name, type: t, init, storage: spec.storage, line: d.line, isConst: spec.isConst });
        }
        if (this.accept(',')) continue;
        this.expect(';', 'after declaration');
        return out;
      }
    }

    parseInitializer() {
      if (this.is('{')) {
        const line = this.line();
        this.next();
        const items = [];
        while (!this.accept('}')) {
          let desig = null;
          if (this.is('.') && this.peek(1).t === 'id') { this.next(); desig = { field: this.next().v }; this.expect('='); }
          else if (this.is('[')) { this.next(); desig = { index: this.constEval(this.parseExpr()) }; this.expect(']'); this.expect('='); }
          items.push({ desig, value: this.parseInitializer() });
          if (!this.accept(',')) { this.expect('}', 'to close initializer list'); break; }
        }
        return { node: 'initlist', items, line };
      }
      return this.parseAssign();
    }

    parseBlock(noNewScope) {
      const line = this.expect('{').line;
      if (!noNewScope) this.pushScope();
      const items = [];
      while (!this.accept('}')) {
        if (this.peek().t === 'eof') throw new CError('compile', 'Missing "}" (block opened on line ' + line + ')', line);
        items.push(...this.parseBlockItem());
      }
      if (!noNewScope) this.popScope();
      return { node: 'block', items, line };
    }

    parseBlockItem() {
      if (this.startsType() && !(this.peek().t === 'id' && this.is(':', 1))) {
        const spec = this.parseSpecifiers();
        if (this.accept(';')) return [];
        const out = [];
        for (;;) {
          const d = this.parseDeclarator();
          const t = d.wrap(spec.base);
          if (spec.storage === 'typedef') this.scopes[this.scopes.length - 1].set(d.name, { typedef: t });
          else {
            this.scopes[this.scopes.length - 1].set(d.name, { var: true });
            let init = null;
            if (this.accept('=')) init = this.parseInitializer();
            if (t.k === 'func') throw new CError('compile', 'Functions cannot be defined inside other functions', d.line);
            out.push({ node: 'decl', name: d.name, type: t, init, isStatic: spec.storage === 'static', line: d.line });
          }
          if (this.accept(',')) continue;
          this.expect(';', 'after declaration');
          return out;
        }
      }
      return [this.parseStatement()];
    }

    parseStatement() {
      const t = this.peek(); const line = t.line;
      if (t.t === 'kw') {
        switch (t.v) {
          case 'if': {
            this.next(); this.expect('(', 'after if'); const cond = this.parseExpr(); this.expect(')', 'after if condition');
            const then = this.parseSubStatement(); let els = null;
            if (this.accept('else')) els = this.parseSubStatement();
            return { node: 'if', cond, then, els, line };
          }
          case 'while': {
            this.next(); this.expect('(', 'after while'); const cond = this.parseExpr(); this.expect(')', 'after while condition');
            return { node: 'while', cond, body: this.parseSubStatement(), line };
          }
          case 'do': {
            this.next(); const body = this.parseSubStatement(); this.expect('while', 'after do body'); this.expect('(');
            const cond = this.parseExpr(); this.expect(')'); this.expect(';', 'after do-while');
            return { node: 'dowhile', cond, body, line };
          }
          case 'for': {
            this.next(); this.expect('(', 'after for'); this.pushScope();
            let init = null;
            if (this.accept(';')) init = null;
            else if (this.startsType()) init = { node: 'block', items: this.parseBlockItem(), line, noScope: true };
            else { init = { node: 'expr', expr: this.parseExpr(), line }; this.expect(';', 'in for loop'); }
            const cond = this.is(';') ? null : this.parseExpr(); this.expect(';', 'in for loop');
            const step = this.is(')') ? null : this.parseExpr(); this.expect(')', 'to close for(...)');
            const body = this.parseSubStatement();
            this.popScope();
            return { node: 'for', init, cond, step, body, line };
          }
          case 'switch': {
            this.next(); this.expect('('); const expr = this.parseExpr(); this.expect(')');
            return { node: 'switch', expr, body: this.parseSubStatement(), line };
          }
          case 'case': {
            this.next(); const v = this.constEval(this.parseCond()); this.expect(':', 'after case value');
            return { node: 'case', value: v, line };
          }
          case 'default': this.next(); this.expect(':'); return { node: 'default', line };
          case 'break': this.next(); this.expect(';', 'after break'); return { node: 'break', line };
          case 'continue': this.next(); this.expect(';', 'after continue'); return { node: 'continue', line };
          case 'return': {
            this.next(); const expr = this.is(';') ? null : this.parseExpr(); this.expect(';', 'after return');
            return { node: 'return', expr, line };
          }
          case 'goto': throw new CError('compile', 'goto is not supported in this sandbox', line);
        }
      }
      if (this.is('{')) return this.parseBlock();
      if (this.accept(';')) return { node: 'empty', line };
      const expr = this.parseExpr();
      this.expect(';', 'at end of statement');
      return { node: 'expr', expr, line };
    }
    parseSubStatement() {
      // a statement used as body; declarations not allowed directly but handle gracefully
      return this.parseStatement();
    }

    // ---- expressions
    parseExpr() {
      let e = this.parseAssign();
      while (this.is(',')) { const line = this.next().line; e = { node: 'comma', a: e, b: this.parseAssign(), line }; }
      return e;
    }
    parseAssign() {
      const lhs = this.parseCond();
      const t = this.peek();
      if (t.t === 'p' && ASSIGN_OPS.has(t.v)) {
        this.next();
        return { node: 'assign', op: t.v, lhs, rhs: this.parseAssign(), line: t.line };
      }
      return lhs;
    }
    parseCond() {
      const c = this.parseBin(1);
      if (this.is('?')) {
        const line = this.next().line; const a = this.parseExpr(); this.expect(':', 'in ?: expression'); const b = this.parseCond();
        return { node: 'cond', c, a, b, line };
      }
      return c;
    }
    parseBin(minPrec) {
      let lhs = this.parseUnary();
      for (;;) {
        const t = this.peek();
        const p = t.t === 'p' ? BINPREC[t.v] : undefined;
        if (p === undefined || p < minPrec) return lhs;
        this.next();
        const rhs = this.parseBin(p + 1);
        lhs = { node: 'bin', op: t.v, a: lhs, b: rhs, line: t.line };
      }
    }
    parseUnary() {
      const t = this.peek(); const line = t.line;
      if (t.t === 'p') {
        switch (t.v) {
          case '++': case '--': this.next(); return { node: 'preinc', op: t.v, e: this.parseUnary(), line };
          case '+': case '-': case '!': case '~': this.next(); return { node: 'unary', op: t.v, e: this.parseCast(), line };
          case '*': this.next(); return { node: 'deref', e: this.parseCast(), line };
          case '&': this.next(); return { node: 'addr', e: this.parseCast(), line };
          case '(': if (this.startsType(1)) return this.parseCast(); break;
        }
      }
      if (this.is('sizeof')) {
        this.next();
        if (this.is('(') && this.startsType(1)) { this.next(); const ty = this.parseTypeName(); this.expect(')'); return { node: 'sizeofT', type: ty, line }; }
        return { node: 'sizeofE', e: this.parseUnary(), line };
      }
      return this.parsePostfix();
    }
    parseCast() {
      if (this.is('(') && this.startsType(1)) {
        const line = this.next().line; const ty = this.parseTypeName(); this.expect(')', 'after cast type');
        if (this.is('{')) throw new CError('compile', 'Compound literals are not supported', line);
        return { node: 'cast', type: ty, e: this.parseCast(), line };
      }
      return this.parseUnary();
    }
    parsePostfix() {
      let e = this.parsePrimary();
      for (;;) {
        const t = this.peek(); const line = t.line;
        if (this.accept('[')) { const idx = this.parseExpr(); this.expect(']'); e = { node: 'index', a: e, i: idx, line }; }
        else if (this.accept('(')) {
          const args = [];
          if (!this.accept(')')) { do args.push(this.parseAssign()); while (this.accept(',')); this.expect(')', 'to close function call'); }
          e = { node: 'call', f: e, args, line };
        } else if (this.accept('.')) { const f = this.next(); if (f.t !== 'id') throw new CError('compile', 'Expected field name after "."', line); e = { node: 'member', e, field: f.v, line }; }
        else if (this.accept('->')) { const f = this.next(); if (f.t !== 'id') throw new CError('compile', 'Expected field name after "->"', line); e = { node: 'member', e: { node: 'deref', e, line }, field: f.v, line, arrow: true }; }
        else if (this.is('++') || this.is('--')) { this.next(); e = { node: 'postinc', op: t.v, e, line }; }
        else return e;
      }
    }
    parsePrimary() {
      const t = this.next(); const line = t.line;
      if (t.t === 'num') return { node: 'num', v: t.v, type: t.type, line };
      if (t.t === 'str') {
        let bytes = t.v.slice();
        while (this.peek().t === 'str') bytes = bytes.concat(this.next().v);
        return { node: 'str', bytes, line };
      }
      if (t.t === 'id') {
        const e = this.lookup(t.v);
        if (e && e.enumConst !== undefined) return { node: 'num', v: e.enumConst, type: T.int, line, name: t.v };
        if (t.v === 'NULL') return { node: 'cast', type: ptr(T.void), e: { node: 'num', v: 0, type: T.int, line }, line };
        return { node: 'id', name: t.v, line };
      }
      if (t.t === 'p' && t.v === '(') { const e = this.parseExpr(); this.expect(')', 'to close "("'); return e; }
      throw new CError('compile', 'Unexpected ' + desc(t) + ' in expression', line);
    }

    constEval(e) {
      const ce = (x) => this.constEval(x);
      switch (e.node) {
        case 'num': return e.v;
        case 'cast': return convert(ce(e.e), e.type);
        case 'sizeofT': return e.type.size;
        case 'unary': { const v = ce(e.e); return e.op === '-' ? -v : e.op === '+' ? v : e.op === '!' ? (v ? 0 : 1) : ~v; }
        case 'cond': return ce(e.c) ? ce(e.a) : ce(e.b);
        case 'bin': {
          const a = ce(e.a), b = ce(e.b);
          switch (e.op) {
            case '+': return a + b; case '-': return a - b; case '*': return a * b;
            case '/': if (!b) throw new CError('compile', 'Division by zero in constant', e.line); return Math.trunc(a / b);
            case '%': return a % b; case '<<': return a << b; case '>>': return a >> b;
            case '&': return a & b; case '|': return a | b; case '^': return a ^ b;
            case '==': return +(a === b); case '!=': return +(a !== b); case '<': return +(a < b); case '>': return +(a > b);
            case '<=': return +(a <= b); case '>=': return +(a >= b); case '&&': return +(a && b); case '||': return +(a || b);
          }
        }
      }
      throw new CError('compile', 'Expected a constant expression', e.line);
    }
  }
  function desc(t) {
    if (!t) return 'end of input';
    if (t.t === 'eof') return 'end of code';
    if (t.t === 'str') return 'a string';
    if (t.t === 'num') return 'number ' + t.v;
    return '"' + t.v + '"';
  }
  function alignUp(x, a) { return Math.ceil(x / a) * a; }

  // ---------------- Interpreter ----------------
  const MEM_SIZE = 1 << 20; // 1 MiB of RAM
  const DATA_BASE = 0x1000;
  const STACK_TOP = MEM_SIZE;
  const STACK_LIMIT = MEM_SIZE - (256 << 10);
  const MMIO_BASE = 0x40000000;
  const FN_BASE = 0x7F000000;

  class Signal { constructor(kind, value) { this.kind = kind; this.value = value; } }
  const BREAK = new Signal('break'), CONTINUE = new Signal('continue');

  class Machine {
    constructor(opts) {
      opts = opts || {};
      this.mem = new Uint8Array(MEM_SIZE);
      this.dv = new DataView(this.mem.buffer);
      this.dataPtr = DATA_BASE;
      this.sp = STACK_TOP;
      this.globals = new Map();
      this.funcs = new Map();
      this.funcList = [];
      this.builtins = new Map();
      this.strCache = new Map();
      this.staticLocals = new Map();
      this.out = '';
      this.maxOut = opts.maxOut || 20000;
      this.steps = 0;
      this.maxSteps = opts.maxSteps || 3000000;
      this.mmio = opts.mmio || null;
      this.depth = 0;
      this.line = 0;
      this.installStdlib();
    }

    err(msg, line) { return new CError('runtime', msg, line || this.line); }

    // memory
    checkAddr(a, n, line) {
      if (a >= MMIO_BASE && a < FN_BASE) return 'mmio';
      if (a < 0x100) throw this.err(a === 0 ? 'NULL pointer dereference' : 'Invalid memory access at address 0x' + hex(a) + ' (near NULL; is a pointer uninitialized?)', line);
      if (a + n > MEM_SIZE) throw this.err('Invalid memory access at address 0x' + hex(a) + ' (outside RAM; is a pointer uninitialized or an index out of range?)', line);
      return 'ram';
    }
    load(t, a) {
      if (t.k === 'arr' || t.k === 'struct' || t.k === 'func') return a;
      const r = this.checkAddr(a, t.size);
      if (r === 'mmio') {
        if (!this.mmio) throw this.err('Access to peripheral address 0x' + hex(a) + ' but no hardware is attached in this exercise');
        return convert(this.mmio.read(a >>> 0, t.size, this), t);
      }
      const dv = this.dv;
      if (t.k === 'float') return t.size === 4 ? dv.getFloat32(a, true) : dv.getFloat64(a, true);
      if (t.k === 'ptr') return dv.getUint32(a, true);
      if (t.k === 'void') throw this.err('Cannot read a value of type void');
      switch (t.size) {
        case 1: return t.signed ? dv.getInt8(a) : dv.getUint8(a);
        case 2: return t.signed ? dv.getInt16(a, true) : dv.getUint16(a, true);
        default: return t.signed ? dv.getInt32(a, true) : dv.getUint32(a, true);
      }
    }
    store(t, a, v) {
      if (t.k === 'struct') { this.copy(a, v, t.size); return; }
      const r = this.checkAddr(a, t.size);
      v = convert(v, t);
      if (r === 'mmio') {
        if (!this.mmio) throw this.err('Write to peripheral address 0x' + hex(a) + ' but no hardware is attached in this exercise');
        this.mmio.write(a >>> 0, t.size, v >>> 0, this); return;
      }
      const dv = this.dv;
      if (t.k === 'float') { if (t.size === 4) dv.setFloat32(a, v, true); else dv.setFloat64(a, v, true); return; }
      switch (t.size) {
        case 1: dv.setUint8(a, v & 0xFF); return;
        case 2: dv.setUint16(a, v & 0xFFFF, true); return;
        default: dv.setUint32(a, v >>> 0, true);
      }
    }
    copy(dst, src, n) {
      if (n <= 0) return;
      this.checkAddr(dst, n); this.checkAddr(src, n);
      this.mem.copyWithin(dst, src, src + n);
    }
    allocData(size, align) {
      this.dataPtr = alignUp(this.dataPtr, align || 4);
      const a = this.dataPtr; this.dataPtr += Math.max(size, 1);
      if (this.dataPtr > STACK_LIMIT) throw this.err('Out of memory for global data');
      return a;
    }
    allocStack(size, align) {
      this.sp = Math.floor((this.sp - Math.max(size, 1)) / (align || 4)) * (align || 4);
      if (this.sp < STACK_LIMIT) throw this.err('Stack overflow (too much recursion or a very large local array?)');
      return this.sp;
    }
    readCString(a, max) {
      let s = ''; max = max || 4096;
      for (let k = 0; k < max; k++) { const c = this.load(T.uchar, a + k); if (!c) break; s += String.fromCharCode(c); }
      return s;
    }
    writeOut(s) {
      if (this.out.length < this.maxOut) { this.out += s; if (this.out.length >= this.maxOut) this.out += '\n[output truncated]\n'; }
    }

    // program setup
    load_program(decls) {
      for (const d of decls) {
        if (d.node === 'func') {
          if (this.funcs.has(d.name) && this.funcs.get(d.name).body) throw new CError('compile', 'Function "' + d.name + '" is defined twice', d.line);
          const f = { name: d.name, type: d.type, params: d.params, body: d.body, line: d.line, idx: this.funcList.length };
          this.funcs.set(d.name, f); this.funcList.push(f);
        } else if (d.node === 'proto') {
          if (!this.funcs.has(d.name) && !this.builtins.has(d.name)) { const f = { name: d.name, type: d.type, proto: true, line: d.line, idx: this.funcList.length }; this.funcs.set(d.name, f); this.funcList.push(f); }
        } else if (d.node === 'gvar') {
          if (d.storage === 'extern' && !d.init) { if (!this.globals.has(d.name)) this.pendingExtern = true; continue; }
          let t = d.type;
          if (t.k === 'arr' && t.n == null) t = this.inferArrayType(t, d.init, d.line);
          if (t.k === 'struct' && !t.complete) throw new CError('compile', 'Variable "' + d.name + '" has incomplete type ' + typeName(t), d.line);
          if (t.k === 'void') throw new CError('compile', 'Variable "' + d.name + '" cannot have type void', d.line);
          if (this.globals.has(d.name)) {
            const g = this.globals.get(d.name);
            if (d.init) { this.line = d.line; this.initialize(g.type, g.addr, d.init); }
            continue;
          }
          const addr = this.allocData(t.size, t.align);
          this.globals.set(d.name, { type: t, addr });
          if (d.init) { this.line = d.line; this.initialize(t, addr, d.init); }
        }
      }
    }
    inferArrayType(t, init, line) {
      if (!init) throw new CError('compile', 'Array needs a size or an initializer', line);
      if (init.node === 'str') return arr(t.of, init.bytes.length + 1);
      if (init.node === 'initlist') {
        let n = 0, idx = 0;
        for (const it of init.items) { if (it.desig && it.desig.index !== undefined) idx = it.desig.index; idx++; n = Math.max(n, idx); }
        return arr(t.of, n);
      }
      throw new CError('compile', 'Cannot infer array size', line);
    }

    initialize(t, addr, init) {
      if (t.k === 'arr') {
        this.mem.fill(0, addr, addr + t.size);
        if (init.node === 'str' && isInt(t.of) && t.of.size === 1) {
          const n = Math.min(init.bytes.length + 1, t.n);
          for (let k = 0; k < n; k++) this.mem[addr + k] = init.bytes[k] || 0;
          return;
        }
        if (init.node !== 'initlist') throw this.err('Array must be initialized with { ... }', init.line);
        let idx = 0;
        for (const it of init.items) {
          if (it.desig && it.desig.index !== undefined) idx = it.desig.index;
          if (idx >= t.n) throw this.err('Too many initializers for array of ' + t.n + ' elements', init.line);
          this.initialize(t.of, addr + idx * t.of.size, it.value);
          idx++;
        }
        return;
      }
      if (t.k === 'struct') {
        if (init.node !== 'initlist') {
          const v = this.rv(this.eval(init));
          if (v.t.k !== 'struct') throw this.err('Cannot initialize ' + typeName(t) + ' with ' + typeName(v.t), init.line);
          this.copy(addr, v.v, t.size); return;
        }
        this.mem.fill(0, addr, addr + t.size);
        let fi = 0;
        for (const it of init.items) {
          if (it.desig && it.desig.field) { fi = t.fields.findIndex((f) => f.name === it.desig.field); if (fi < 0) throw this.err(typeName(t) + ' has no field named "' + it.desig.field + '"', init.line); }
          const f = t.fields[fi];
          if (!f) throw this.err('Too many initializers for ' + typeName(t), init.line);
          this.initialize(f.type, addr + f.off, it.value);
          fi++;
          if (t.union) break;
        }
        return;
      }
      if (init.node === 'initlist') {
        if (init.items.length === 0) { this.store(t, addr, 0); return; }
        return this.initialize(t, addr, init.items[0].value);
      }
      const v = this.rv(this.eval(init));
      this.store(t, addr, this.convertForAssign(v, t, init.line));
    }

    convertForAssign(v, t, line) {
      if (t.k === 'ptr') {
        if (v.t.k === 'ptr' || isInt(v.t)) return v.v;
        throw this.err('Cannot assign ' + typeName(v.t) + ' to a pointer', line);
      }
      if (isArith(t)) {
        if (isArith(v.t)) return convert(v.v, t);
        if (v.t.k === 'ptr') return convert(v.v, t);
        throw this.err('Cannot assign ' + typeName(v.t) + ' to ' + typeName(t), line);
      }
      if (t.k === 'struct') {
        if (v.t !== t) throw this.err('Cannot assign ' + typeName(v.t) + ' to ' + typeName(t), line);
        return v.v;
      }
      throw this.err('Cannot assign to ' + typeName(t), line);
    }

    // value helpers: rvalue {t,v}; lvalue {lv:true,t,addr}
    rv(x) {
      if (!x.lv) return x;
      const t = x.t;
      if (t.k === 'arr') return { t: ptr(t.of), v: x.addr };
      if (t.k === 'struct') return { t, v: x.addr };
      if (t.k === 'func') return { t: ptr(t), v: x.addr };
      return { t, v: this.load(t, x.addr) };
    }
    truthy(x) { const v = this.rv(x); if (v.t.k === 'struct') throw this.err('A struct cannot be used as a condition'); return v.v !== 0; }

    lookupVar(name, line) {
      for (let s = this.scope; s; s = s.parent) if (s.vars.has(name)) return s.vars.get(name);
      if (this.globals.has(name)) return this.globals.get(name);
      return null;
    }

    tick(line) {
      this.line = line;
      if (++this.steps > this.maxSteps) throw new CError('timeout', 'Execution took too long (infinite loop? waiting forever on a status flag that never changes?)', line);
    }

    eval(e) {
      this.tick(e.line);
      switch (e.node) {
        case 'num': return { t: e.type, v: e.v };
        case 'str': {
          let a = this.strCache.get(e);
          if (a === undefined) { a = this.allocData(e.bytes.length + 1, 1); for (let k = 0; k < e.bytes.length; k++) this.mem[a + k] = e.bytes[k]; this.mem[a + e.bytes.length] = 0; this.strCache.set(e, a); }
          return { t: ptr(T.char), v: a };
        }
        case 'id': {
          const v = this.lookupVar(e.name);
          if (v) return { lv: true, t: v.type, addr: v.addr };
          if (this.funcs.has(e.name)) { const f = this.funcs.get(e.name); return { t: ptr(f.type), v: FN_BASE + f.idx, fn: f }; }
          if (this.builtins.has(e.name)) return { t: ptr(fnT(T.int, [], true)), v: 0, builtin: this.builtins.get(e.name), bname: e.name };
          throw this.err('"' + e.name + '" is not declared', e.line);
        }
        case 'comma': this.eval(e.a); return this.rv(this.eval(e.b));
        case 'cast': {
          const v = this.rv(this.eval(e.e));
          if (e.type.k === 'void') return { t: T.void, v: 0 };
          if (e.type.k === 'struct' || e.type.k === 'arr') throw this.err('Cannot cast to ' + typeName(e.type), e.line);
          if (v.t.k === 'struct') throw this.err('Cannot cast a struct to ' + typeName(e.type), e.line);
          return { t: e.type, v: convert(v.v, e.type) };
        }
        case 'sizeofT': return { t: T.uint, v: e.type.size };
        case 'sizeofE': {
          const sp = this.sp, st = this.steps;
          const x = this.eval(e.e);
          this.sp = sp; this.steps = st;
          return { t: T.uint, v: x.lv ? x.t.size : x.t.size };
        }
        case 'unary': {
          const v = this.rv(this.eval(e.e));
          if (e.op === '!') return { t: T.int, v: v.v ? 0 : 1 };
          if (!isArith(v.t)) throw this.err('Operator ' + e.op + ' needs a number, got ' + typeName(v.t), e.line);
          const pt = promote(v.t);
          if (e.op === '-') return { t: pt, v: convert(-v.v, pt) };
          if (e.op === '+') return { t: pt, v: convert(v.v, pt) };
          if (pt.k === 'float') throw this.err('Operator ~ cannot be used on floating-point values', e.line);
          return { t: pt, v: convert(~v.v, pt) };
        }
        case 'deref': {
          const p = this.rv(this.eval(e.e));
          if (p.t.k !== 'ptr') throw this.err('Cannot dereference a value of type ' + typeName(p.t) + ' (it is not a pointer)', e.line);
          if (p.t.to.k === 'func') return p;
          if (p.t.to.k === 'void') throw this.err('Cannot dereference a void* (cast it to a typed pointer first)', e.line);
          return { lv: true, t: p.t.to, addr: p.v };
        }
        case 'addr': {
          const x = this.eval(e.e);
          if (x.fn) return x;
          if (!x.lv) throw this.err('Cannot take the address of a temporary value', e.line);
          return { t: ptr(x.t), v: x.addr };
        }
        case 'index': {
          const base = this.eval(e.a);
          let a = this.rv(base), i = this.rv(this.eval(e.i));
          if (a.t.k !== 'ptr' && i.t.k === 'ptr') { const tmp = a; a = i; i = tmp; }
          if (a.t.k !== 'ptr') throw this.err('Cannot index into a value of type ' + typeName(a.t), e.line);
          if (!isInt(i.t)) throw this.err('Array index must be an integer', e.line);
          const el = a.t.to;
          if (el.k === 'void') throw this.err('Cannot index a void*', e.line);
          // bounds check against declared arrays where possible
          if (base.lv && base.t.k === 'arr' && base.t.n != null && (i.v < 0 || i.v >= base.t.n))
            throw this.err('Array index ' + (i.v | 0) + ' is out of bounds (array has ' + base.t.n + ' elements, valid indexes 0..' + (base.t.n - 1) + ')', e.line);
          return { lv: true, t: el, addr: (a.v + (i.v | 0) * el.size) >>> 0 };
        }
        case 'member': {
          const s = this.eval(e.e);
          const st = s.t;
          if (st.k !== 'struct') throw this.err((e.arrow ? '"->" needs a pointer to a struct' : '"." needs a struct') + ', got ' + typeName(e.arrow ? ptr(st) : st), e.line);
          const f = st.fields.find((x) => x.name === e.field);
          if (!f) throw this.err(typeName(st) + ' has no field named "' + e.field + '"', e.line);
          const base = s.lv ? s.addr : s.v;
          return { lv: true, t: f.type, addr: base + f.off };
        }
        case 'call': return this.call(e);
        case 'assign': return this.assign(e);
        case 'preinc': case 'postinc': {
          const x = this.eval(e.e);
          if (!x.lv) throw this.err('Operand of ' + e.op + ' must be a variable', e.line);
          const old = this.load(x.t, x.addr);
          let nv;
          const d = e.op === '++' ? 1 : -1;
          if (x.t.k === 'ptr') nv = old + d * x.t.to.size;
          else if (isArith(x.t)) nv = old + d;
          else throw this.err('Cannot use ' + e.op + ' on ' + typeName(x.t), e.line);
          this.store(x.t, x.addr, nv);
          return { t: x.t, v: e.node === 'preinc' ? convert(nv, x.t) : old };
        }
        case 'cond': return this.truthy(this.eval(e.c)) ? this.rv(this.eval(e.a)) : this.rv(this.eval(e.b));
        case 'bin': {
          if (e.op === '&&') return { t: T.int, v: this.truthy(this.eval(e.a)) && this.truthy(this.eval(e.b)) ? 1 : 0 };
          if (e.op === '||') return { t: T.int, v: this.truthy(this.eval(e.a)) || this.truthy(this.eval(e.b)) ? 1 : 0 };
          return this.binop(e.op, this.rv(this.eval(e.a)), this.rv(this.eval(e.b)), e.line);
        }
      }
      throw this.err('Unsupported expression: ' + e.node, e.line);
    }

    binop(op, a, b, line) {
      // pointer arithmetic
      if (a.t.k === 'ptr' || b.t.k === 'ptr') {
        if (op === '+' || op === '-') {
          if (a.t.k === 'ptr' && b.t.k === 'ptr') {
            if (op === '+') throw this.err('Cannot add two pointers', line);
            const sz = a.t.to.size || 1;
            return { t: T.int, v: ((a.v - b.v) / sz) | 0 };
          }
          if (op === '-' && b.t.k === 'ptr') throw this.err('Cannot subtract a pointer from a number', line);
          const p = a.t.k === 'ptr' ? a : b, n = a.t.k === 'ptr' ? b : a;
          if (!isInt(n.t)) throw this.err('Pointer arithmetic needs an integer', line);
          const sz = p.t.to.k === 'void' ? 1 : p.t.to.size;
          return { t: p.t, v: (p.v + (op === '+' ? 1 : -1) * (n.v | 0) * sz) >>> 0 };
        }
        if (['==', '!=', '<', '>', '<=', '>='].includes(op)) {
          const x = a.v >>> 0, y = b.v >>> 0;
          return { t: T.int, v: cmp(op, x, y) };
        }
        throw this.err('Operator ' + op + ' cannot be used with pointers', line);
      }
      if (!isArith(a.t) || !isArith(b.t)) throw this.err('Operator ' + op + ' needs numbers, got ' + typeName(a.t) + ' and ' + typeName(b.t), line);
      if (op === '<<' || op === '>>') {
        if (a.t.k === 'float' || b.t.k === 'float') throw this.err('Shift operators need integers', line);
        const pt = promote(a.t);
        const n = b.v >>> 0;
        if (n >= 32) throw this.err('Shift by ' + (b.v | 0) + ' bits is undefined behavior for a 32-bit value', line);
        if (op === '<<') return { t: pt, v: convert(a.v << n, pt) };
        return { t: pt, v: pt.signed ? (a.v | 0) >> n : (a.v >>> 0) >>> n };
      }
      const ct = common(a.t, b.t);
      const x = convert(a.v, ct), y = convert(b.v, ct);
      if (ct.k === 'float') {
        switch (op) {
          case '+': return { t: ct, v: x + y }; case '-': return { t: ct, v: x - y };
          case '*': return { t: ct, v: x * y }; case '/': return { t: ct, v: x / y };
          case '%': case '&': case '|': case '^': throw this.err('Operator ' + op + ' cannot be used on floating-point values', line);
          default: return { t: T.int, v: cmp(op, x, y) };
        }
      }
      switch (op) {
        case '+': return { t: ct, v: convert(x + y, ct) };
        case '-': return { t: ct, v: convert(x - y, ct) };
        case '*': return { t: ct, v: convert(ct.signed ? Math.imul(x, y) : Math.imul(x, y) >>> 0, ct) };
        case '/': if (y === 0) throw this.err('Division by zero', line); return { t: ct, v: convert(Math.trunc(x / y), ct) };
        case '%': if (y === 0) throw this.err('Modulo by zero', line); return { t: ct, v: convert(x % y, ct) };
        case '&': return { t: ct, v: convert(x & y, ct) };
        case '|': return { t: ct, v: convert(x | y, ct) };
        case '^': return { t: ct, v: convert(x ^ y, ct) };
        default: return { t: T.int, v: cmp(op, x, y) };
      }
    }

    assign(e) {
      const x = this.eval(e.lhs);
      if (!x.lv) throw this.err('Left side of ' + e.op + ' must be a variable, array element or field', e.line);

    solution: `#include <stdint.h>
#include <stdbool.h>

uint32_t set_bit(uint32_t reg, uint8_t n)    { return reg | (1u << n); }
uint32_t clear_bit(uint32_t reg, uint8_t n)  { return reg & ~(1u << n); }
uint32_t toggle_bit(uint32_t reg, uint8_t n) { return reg ^ (1u << n); }
bool     test_bit(uint32_t reg, uint8_t n)   { return (reg >> n) & 1u; }

uint32_t read_field(uint32_t reg, uint8_t pos, uint8_t width) {
    uint32_t mask = (1u << width) - 1u;
    return (reg >> pos) & mask;
}

uint32_t write_field(uint32_t reg, uint8_t pos, uint8_t width, uint32_t value) {
    uint32_t mask = ((1u << width) - 1u) << pos;
    return (reg & ~mask) | ((value << pos) & mask);
}

    solution: `#include <stdint.h>

uint16_t get_u16_le(const uint8_t *p) { return (uint16_t)(p[0] | (p[1] << 8)); }
uint16_t get_u16_be(const uint8_t *p) { return (uint16_t)((p[0] << 8) | p[1]); }

uint32_t get_u32_le(const uint8_t *p) {
    return (uint32_t)p[0] | ((uint32_t)p[1] << 8) |
           ((uint32_t)p[2] << 16) | ((uint32_t)p[3] << 24);
}

uint32_t get_u32_be(const uint8_t *p) {
    return ((uint32_t)p[0] << 24) | ((uint32_t)p[1] << 16) |
           ((uint32_t)p[2] << 8) | (uint32_t)p[3];
}

void put_u16_be(uint8_t *p, uint16_t v) {
    p[0] = (uint8_t)(v >> 8);
    p[1] = (uint8_t)(v & 0xFFu);
}

void put_u32_le(uint8_t *p, uint32_t v) {
    for (int i = 0; i < 4; i++) {
        p[i] = (uint8_t)(v >> (8 * i));
    }
}

    solution: `#include <stdint.h>
#include <stdbool.h>
#include "bits.h"
#include "endian.h"

void read_panel(uint8_t frame[2]);

#define MODE_BIT          9u
#define DEBOUNCE_SAMPLES  5

bool mode_pressed_raw(const uint8_t frame[2]) {
    uint16_t status = get_u16_be(frame);    // frame[0] is the high byte
    return test_bit(status, MODE_BIT);
}

bool mode_button_debounced(void) {
    static bool state = false;   // debounced state: starts released
    static int  count = 0;       // consecutive raw samples that disagree with state

    uint8_t frame[2];
    read_panel(frame);
    bool raw = mode_pressed_raw(frame);

    if (raw == state) {
        count = 0;                           // agrees: restart the count
    } else if (++count >= DEBOUNCE_SAMPLES) {
        state = raw;                         // enough in a row: accept the change
        count = 0;
    }
    return state;
}
`,

        const word = (rnd() & ~(1 << 9)) | (ch === '1' ? 1 << 9 : 0);

    starter: `#include <stdint.h>

uint8_t count_ones(uint8_t b) {
    return 0; // TODO

    solution: `#include <stdint.h>
#include <stdbool.h>

uint8_t count_ones(uint8_t b) {
    uint8_t n = 0;
    while (b) {
        n += b & 1u;
        b >>= 1;
    }
    return n;
}

uint8_t even_parity_bit(uint8_t data) {
    return count_ones(data) & 1u;   // odd number of 1s -> send a 1
}

bool parity_ok(uint8_t data, uint8_t parity_bit) {
    return ((count_ones(data) + parity_bit) & 1u) == 0;
}
`,

  EX['crc8'] = {
    title: 'CRC-8 for packet integrity',
    challenge: true,
    required: ['crc8', 'packet_valid'],
    prompt: `<p>Parity catches one flipped bit. A CRC catches burst errors too, which is why SMBus, many sensors and CAN all use one. Implement the CRC-8 used by SMBus Packet Error Checking: polynomial <b>x⁸ + x² + x + 1</b> (<code>0x07</code>), initial value 0x00, MSB first, no final XOR.</p>
<p>The bitwise algorithm, for each byte: XOR it into the CRC, then 8 times: if the top bit is set, shift left and XOR with 0x07, otherwise just shift left.</p>
<p><code>packet_valid(pkt, len)</code> treats the last byte as the CRC of everything before it.</p>
<p>The standard check value for this CRC over the ASCII string <code>"123456789"</code> is <b>0xF4</b>.</p>`,
    starter: `#include <stdint.h>
#include <stdbool.h>

uint8_t crc8(const uint8_t *data, int len) {
    uint8_t crc = 0x00;
    // TODO

}

bool packet_valid(const uint8_t *pkt, int len) {
    return false; // TODO
}
`,
    solution: `#include <stdint.h>
#include <stdbool.h>

uint8_t crc8(const uint8_t *data, int len) {
    uint8_t crc = 0x00;
    for (int i = 0; i < len; i++) {
        crc ^= data[i];
        for (int b = 0; b < 8; b++) {
            if (crc & 0x80u) crc = (uint8_t)((crc << 1) ^ 0x07u);
            else             crc = (uint8_t)(crc << 1);
        }
    }
    return crc;
}

bool packet_valid(const uint8_t *pkt, int len) {
    if (len < 2) return false;
    return crc8(pkt, len - 1) == pkt[len - 1];
}
`,

    EXPECT_HEX(crc8(&one, 1), 0x07, "crc8({01})");
    EXPECT_HEX(crc8(check, 0), 0x00, "empty input returns the initial value");
    uint8_t ff[2] = {0xFF, 0xFF};
    EXPECT_HEX(crc8(ff, 2), 0x00 ^ 0x00 ^ 0x00 ^ crc8(ff, 2), "crc8 is deterministic");
}

  function uartSim(m, api) {
    const T = MiniC.T;
    const s = { tx: [], busy: 0, lost: 0, rx: [], rxne: false, rdr: 0, srReads: 0, ore: false };
    m.sim = s;
    const SR = 0x40004400, DR = 0x40004404, BRR = 0x40004408, CR1 = 0x4000440C;
    m.mmio = {
      read(a) {
        if (a === SR) {
          s.srReads++;
          if (s.busy > 0) s.busy--;
          if (!s.rxne && s.rx.length) { s.rdr = s.rx.shift(); s.rxne = true; }
          return (s.busy === 0 ? 0xC0 : 0) | (s.rxne ? 0x20 : 0);
        }
        if (a === DR) {
          if (!s.rxne && s.rx.length) { s.rdr = s.rx.shift(); s.rxne = true; }
          const v = s.rdr; s.rxne = false; return v;
        }
        if (a === BRR || a === CR1) return 0;
        vio(api, 'Read from unexpected address 0x' + a.toString(16).toUpperCase()); return 0;
      },
      write(a, size, v) {
        if (a === DR) {
          if (s.busy > 0) { s.lost++; vio(api, 'Wrote 0x' + (v & 0xFF).toString(16).toUpperCase().padStart(2, '0') + ' to DR while TXE was 0: the previous byte was still sending, so data was corrupted'); }
          s.tx.push(v & 0xFF); s.busy = 3; return;
        }
        if (a === SR) return;
        if (a === BRR || a === CR1) return;
        vio(api, 'Write to unexpected address 0x' + a.toString(16).toUpperCase());
      },
    };
    builtin(m, '__tx_reset', () => { s.tx = []; s.lost = 0; s.busy = 0; s.srReads = 0; });
    builtin(m, '__tx_count', () => s.tx.length);
    builtin(m, '__tx_byte', (args) => s.tx[args[0].v] === undefined ? -1 : s.tx[args[0].v]);
    builtin(m, '__tx_lost', () => s.lost);
    builtin(m, '__sr_reads', () => s.srReads);
    builtin(m, '__rx_inject', (args) => { s.rx.push(args[0].v & 0xFF); });
    builtin(m, '__tx_equals', (args) => {
      const exp = m.readCString(args[0].v);
      const got = String.fromCharCode(...s.tx);
      const show = (x) => JSON.stringify(x);
      api.current.checks.push({ ok: got === exp, msg: (got === exp ? 'transmitted ' + show(got) : 'expected to transmit ' + show(exp) + ', got ' + show(got)) });
    });
  }

void uart_putc(char c) {
    while ((USART2_SR & USART_SR_TXE) == 0u) {

    }
    USART2_DR = (uint8_t)c;

void uart_puts(const char *s) {
    while (*s) {
        if (*s == '\\n') uart_putc('\\r');
        uart_putc(*s++);
    }
}

int uart_getc_nonblocking(void) {
    if (USART2_SR & USART_SR_RXNE) {

    solution: `#include <stdint.h>
#include <stdbool.h>

#define RB_SIZE 16u   // must be a power of two

typedef struct {
    uint8_t buf[RB_SIZE];
    volatile uint8_t head;   // next slot to write (owned by the ISR)
    volatile uint8_t tail;   // next slot to read  (owned by main loop)
} ringbuf_t;

void rb_init(ringbuf_t *rb) {
    rb->head = 0;
    rb->tail = 0;
}

bool rb_put(ringbuf_t *rb, uint8_t byte) {
    uint8_t next = (uint8_t)((rb->head + 1u) & (RB_SIZE - 1u));
    if (next == rb->tail) return false;      // full
    rb->buf[rb->head] = byte;                // write data first...
    rb->head = next;                         // ...then publish it
    return true;
}

bool rb_get(ringbuf_t *rb, uint8_t *out) {
    if (rb->tail == rb->head) return false;  // empty
    *out = rb->buf[rb->tail];
    rb->tail = (uint8_t)((rb->tail + 1u) & (RB_SIZE - 1u));
    return true;
}

uint8_t rb_count(const ringbuf_t *rb) {
    return (uint8_t)((rb->head - rb->tail) & (RB_SIZE - 1u));
}
`,

    rb_put(&rb, 'a'); rb_put(&rb, 'b'); rb_put(&rb, 'c');

    rb_get(&rb, &x); EXPECT_EQ(x, 'b', "then 'b'");

    for (int i = 0; i < 20; i++) accepted += rb_put(&rb, (uint8_t)i);

void parser_init(parser_t *p) {
    p->state = WAIT_SYNC;
    p->len = 0;
    p->idx = 0;
    p->sum = 0;
    p->errors = 0;
}

bool parser_feed(parser_t *p, uint8_t b) {
    switch (p->state) {
    case WAIT_SYNC:
        if (b == SYNC_BYTE) p->state = WAIT_LEN;
        break;
    case WAIT_LEN:
        if (b == 0 || b > MAX_PAYLOAD) {
            p->errors++;
            p->state = WAIT_SYNC;
        } else {
            p->len = b;
            p->idx = 0;
            p->sum = b;
            p->state = WAIT_PAYLOAD;
        }
        break;
    case WAIT_PAYLOAD:
        p->payload[p->idx++] = b;
        p->sum = (uint8_t)(p->sum + b);
        if (p->idx == p->len) p->state = WAIT_CHECKSUM;
        break;
    case WAIT_CHECKSUM:
        p->state = WAIT_SYNC;
        if (b == p->sum) return true;
        p->errors++;
        break;
    }
    return false;
}

      busyPolls: 0,
    };

    const V = (msg) => { s.violations++; vio(api, msg); };
    function finishWrite() {
      if (s.dev === 0x50 && !s.readMode) {
        const e = s.ee;
        if (e.wbytes.length > 2) {
          const start = (e.wbytes[0] << 8 | e.wbytes[1]) & 0x7FFF;
          const data = e.wbytes.slice(2);
          if (data.length > 64) V('Sent ' + data.length + ' data bytes in one EEPROM write; the page buffer holds 64');
          const page = start & ~63;
          let crossed = false;
          for (let k = 0; k < data.length; k++) {
            const off = (start + k) & 63;
            if (k > 0 && off === 0) crossed = true;

    solution: I2C_DEFS + `
#define EEPROM_ADDR  0x50u
#define PAGE_SIZE    64u

// Wait until the EEPROM finishes its internal write cycle.
// Leaves the bus OWNED (START sent, address ACKed) on success.
static bool wait_ready(void) {
    for (int tries = 0; tries < 1000; tries++) {
        i2c_start();
        if (i2c_write((uint8_t)(EEPROM_ADDR << 1))) return true;
        i2c_stop();
    }
    return false;
}

int eeprom_write(uint16_t mem_addr, const uint8_t *data, int len) {
    while (len > 0) {
        int room  = (int)(PAGE_SIZE - (mem_addr % PAGE_SIZE));
        int chunk = len < room ? len : room;

        if (!wait_ready()) return -1;            // bus already released
        bool ok = i2c_write((uint8_t)(mem_addr >> 8)) &&
                  i2c_write((uint8_t)(mem_addr & 0xFFu));
        for (int i = 0; ok && i < chunk; i++) ok = i2c_write(data[i]);
        i2c_stop();                              // starts the write cycle
        if (!ok) return -1;

        mem_addr += (uint16_t)chunk;
        data     += chunk;
        len      -= chunk;
    }
    return 0;
}
`,

<li><code>can_arbitration_winner(ids, n)</code>: several nodes start transmitting 11-bit IDs at the same instant. Simulate arbitration bit by bit from bit 10 (MSB) down to bit 0. The bus is a wired-AND, so it shows dominant (0) if <i>any</i> node sends 0. A node that sends recessive (1) but sees dominant (0) on the bus stops transmitting. Return the index of the node that wins. You may assume the IDs are unique.</li></ul>`,

    solution: `#include <stdint.h>
#include <stdbool.h>

bool can_filter_match(uint32_t id, uint32_t filter, uint32_t mask) {
    return ((id ^ filter) & mask) == 0u;
}

int can_arbitration_winner(const uint16_t *ids, int n) {
    bool active[16];
    for (int i = 0; i < n; i++) active[i] = true;

    for (int bit = 10; bit >= 0; bit--) {
        int bus = 1;                                  // recessive unless someone pulls it down
        for (int i = 0; i < n; i++)
            if (active[i] && ((ids[i] >> bit) & 1u) == 0u) bus = 0;
        for (int i = 0; i < n; i++)
            if (active[i] && (int)((ids[i] >> bit) & 1u) != bus) active[i] = false;  // lost
    }
    for (int i = 0; i < n; i++) if (active[i]) return i;
    return -1;
}

    solution: `#include <stdint.h>

uint32_t can_get_signal(const uint8_t data[8], uint8_t start_bit, uint8_t length) {
    uint32_t value = 0;
    for (uint8_t i = 0; i < length; i++) {
        uint8_t k = (uint8_t)(start_bit + i);
        uint32_t bit = (data[k / 8] >> (k % 8)) & 1u;
        value |= bit << i;

    return can_get_signal(data, 24, 16) * 0.125f;
}

`,
    solution: `#include <stdint.h>

int can_stuff(const uint8_t *in, int n, uint8_t *out) {
    int len = 0;
    int run = 0;
    uint8_t last = 2;              // no previous bit yet
    for (int i = 0; i < n; i++) {
        uint8_t b = in[i];
        out[len++] = b;
        if (b == last) run++;
        else { run = 1; last = b; }
        if (run == 5) {
            uint8_t stuff = (uint8_t)!b;
            out[len++] = stuff;    // insert the complement
            last = stuff;          // the stuff bit starts the next run
            run = 1;
        }
    }
    return len;
}
`,

static void handle_wheel(vehicle_state_t *vs, const can_frame_t *f) {
    const uint8_t *d = f->data;
    if (f->dlc != 4 || (uint8_t)(d[0] ^ d[1] ^ d[2]) != d[3]) {
        vs->rejected++;
        return;
    }
    uint8_t counter = d[2] & 0x0Fu;
    if (vs->counter_seen && counter != ((vs->last_counter + 1u) & 0x0Fu)) {
        vs->last_counter = counter;     // resynchronise
        vs->rejected++;
        return;
    }
    vs->last_counter = counter;
    vs->counter_seen = true;
    uint16_t raw = get_u16_le(&d[0]);
    vs->wheel_speed_kph = raw * 0.01f;
    vs->accepted++;
}

static void handle_gear(vehicle_state_t *vs, const can_frame_t *f) {
    if (f->dlc != 1 || f->data[0] > 6u) {
        vs->rejected++;
        return;
    }
    vs->gear = f->data[0];
    vs->accepted++;
}

void can_rx_handler(vehicle_state_t *vs, const can_frame_t *f) {
    switch (f->id) {
    case ID_WHEEL: handle_wheel(vs, f); break;
    case ID_GEAR:  handle_gear(vs, f);  break;
    default:       break;              // not for us
    }
}
`,

}

    can_frame_t f; memset(&f, 0, sizeof f);

#include <stdbool.h>
#include "bits.h"

#define SYSCLK_MAX_HZ 84000000u

uint32_t pll_sysclk_hz(uint32_t src_hz, uint32_t m, uint32_t n, uint32_t p) {
    return (src_hz / m) * n / p;
}

bool pll_config_valid(uint32_t src_hz, uint32_t m, uint32_t n, uint32_t p, uint32_t q) {
    if (m < 2u || m > 63u) return false;
    if (n < 50u || n > 432u) return false;
    if (p != 2u && p != 4u && p != 6u && p != 8u) return false;
    if (q < 2u || q > 15u) return false;

    uint32_t vco_in = src_hz / m;
    if (vco_in < 1000000u || vco_in > 2000000u) return false;

    uint32_t vco_out = vco_in * n;
    if (vco_out < 100000000u || vco_out > 432000000u) return false;

    return vco_out / p <= SYSCLK_MAX_HZ;
}

uint32_t pllcfgr_update(uint32_t old, uint32_t m, uint32_t n, uint32_t p, uint32_t q, bool src_hse) {
    uint32_t r = old;
    r = write_field(r, 0u, 6u, m);            // PLLM   bits 5:0
    r = write_field(r, 6u, 9u, n);            // PLLN   bits 14:6
    r = write_field(r, 16u, 2u, p / 2u - 1u); // PLLP   bits 17:16
    r = write_field(r, 22u, 1u, src_hse ? 1u : 0u); // PLLSRC bit 22
    r = write_field(r, 24u, 4u, q);           // PLLQ   bits 27:24
    return r;
}

void stm32_console_clock_on(void) {
    RCC_AHB1ENR = set_bit(RCC_AHB1ENR, RCC_AHB1ENR_GPIOAEN_POS);
    RCC_APB1ENR = set_bit(RCC_APB1ENR, RCC_APB1ENR_USART2EN_POS);

void ra_console_clock_on(uint8_t ch) {
    if (ch > 9u) return;
    R_MSTPCRB = clear_bit(R_MSTPCRB, (uint8_t)(31u - ch));   // 0 = module running
}

bool ra_set_pclkb_div(uint8_t code) {
    if (code > 6u) return false;
    R_PRCR = (uint16_t)(PRCR_KEY | PRCR_PRC0);                // unlock clock registers

    R_PRCR = (uint16_t)PRCR_KEY;                              // lock again
    return true;
}

    solution: `#include <stdint.h>
#include <stdbool.h>

typedef enum { TASK_READY, TASK_BLOCKED, TASK_SUSPENDED } task_state_t;

typedef struct {
    const char  *name;
    uint8_t      priority;
    task_state_t state;
    uint32_t     wake_tick;
} tcb_t;

void scheduler_tick(tcb_t *tasks, int n, uint32_t now) {
    for (int i = 0; i < n; i++) {
        if (tasks[i].state == TASK_BLOCKED && (int32_t)(now - tasks[i].wake_tick) >= 0) {
            tasks[i].state = TASK_READY;
        }
    }
}

int pick_next_task(const tcb_t *tasks, int n, int current) {
    int best = -1;
    // Start just after current and go all the way round, so equal-priority
    // tasks take turns. Strictly greater keeps the first one found.
    for (int k = 1; k <= n; k++) {
        int i = (current + k) % n;
        if (i < 0) i += n;
        if (tasks[i].state != TASK_READY) continue;
        if (best < 0 || tasks[i].priority > tasks[best].priority) best = i;
    }
    return best;
}

void USART2_IRQHandler(void) {
    BaseType_t woken = pdFALSE;
    while (USART2_SR & USART_SR_RXNE) {
        uint8_t b = (uint8_t)USART2_DR;            // reading DR clears RXNE
        if (xQueueSendFromISR(rx_queue, &b, &woken) == errQUEUE_FULL) {
            rx_dropped++;
        }
    }
    portYIELD_FROM_ISR(woken);   // switch straight to the reader if it outranks us
}

int read_line(char *buf, int max, TickType_t timeout) {
    int len = 0;
    uint8_t c;
    for (;;) {
        if (xQueueReceive(rx_queue, &c, timeout) != pdTRUE) return -1;
        if (c == '\\n') break;
        if (c == '\\r') continue;
        if (len < max - 1) buf[len++] = (char)c;
    }
    buf[len] = '\\0';
    return len;
}

    [EXIT2_IR]         = { SHIFT_IR,      UPDATE_IR },
    [UPDATE_IR]        = { RUN_TEST_IDLE, SELECT_DR },

tap_state_t tap_next(tap_state_t s, int tms) {
